; ReGrip ESP32 Grip Sensor — PlatformIO project config
; 하드웨어 실기 검증 전(pre-hardware) 프로토타입.
;
; 플래시:  pio run -t upload
; 모니터:  pio device monitor -b 115200
;
; ※ 빌드 전 include/config.h.example 을 include/config.h 로 복사하고
;   WiFi 자격증명을 채워야 합니다(없으면 컴파일 에러로 안내).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; links2004/arduinoWebSockets (Markus Sattler) — WebSocketsServer v2 API
lib_deps =
    links2004/WebSockets@^2.4
