<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReGrip — 크레인 게임</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=DM+Sans:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script src="tailwind-config.js"></script>
<style>
  /* Viewport */
  #game-viewport {
    background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 40%, #FFF8F6 100%);
    position: relative; overflow: hidden;
  }

  /* Crane assembly moves horizontally */
  #crane-assembly {
    position: absolute;
    top: 0;
    transition: left 0.05s linear;
  }

  /* Claw prong open/close via transform */
  #prong-left  { transform-origin: top right;  transition: transform 0.2s ease; }
  #prong-right { transform-origin: top left;   transition: transform 0.2s ease; }
  .claw-open   #prong-left  { transform: rotate(-30deg); }
  .claw-open   #prong-right { transform: rotate(30deg); }
  .claw-closed #prong-left  { transform: rotate(5deg);  }
  .claw-closed #prong-right { transform: rotate(-5deg); }

  /* Hold donut (SVG) */
  #donut-arc {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    transition: stroke-dashoffset 0.1s linear, stroke 0.18s ease;
    stroke-linecap: round;
  }
  #donut-arc-claw { transition: stroke-dashoffset 0.1s linear, stroke 0.18s ease; }

  /* Hold donut early-release feedback */
  @keyframes donutShake {
    0%,100% { transform: translateX(-50%); }
    20% { transform: translateX(-50%) translateX(-4px); }
    40% { transform: translateX(-50%) translateX(4px); }
    60% { transform: translateX(-50%) translateX(-3px); }
    80% { transform: translateX(-50%) translateX(3px); }
  }
  #hold-donut-wrap.donut-shake { animation: donutShake 0.2s ease-in-out; }
  #donut-ring.donut-flash { border-color: var(--error) !important; }

  /* Capsules */
  .capsule {
    position: absolute;
    width: 54px; height: 72px;
    border-radius: 50%;
    border: 4px solid #0F172A;
    box-shadow: 3px 3px 0 #0F172A;
    cursor: default;
    transition: transform 0.3s, opacity 0.3s;
    overflow: hidden;
  }
  .capsule::before {
    content:''; position:absolute;
    top:0; left:0; right:0; height:50%;
    background:rgba(255,255,255,0.3);
    border-radius:50% 50% 0 0 / 60% 60% 40% 40%;
  }
  .capsule.grabbed {
    animation: capsuleGrab 0.4s ease forwards;
  }
  @keyframes capsuleGrab {
    0%   { transform: translateY(0); opacity:1; }
    60%  { transform: translateY(-40px) scale(0.8); opacity:0.8; }
    100% { transform: translateY(-80px) scale(0.5); opacity:0; }
  }

  /* Capsule drop in chute (bounce) */
  .chute-capsule {
    width:28px; height:36px; border-radius:50%;
    border:2px solid #0F172A;
    animation: chuteSlide 0.5s ease forwards;
  }
  @keyframes chuteSlide {
    0%   { transform: translateY(-40px); opacity:0; }
    70%  { transform: translateY(4px);   opacity:1; }
    100% { transform: translateY(0);     opacity:1; }
  }

  /* Floating +1 label */
  .plus-one {
    position: absolute; z-index: 20; pointer-events: none;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px;
    color: #10B981; text-shadow: 2px 2px 0 #0F172A;
    transform: translate(-50%, -50%);
  }

  /* Floor dot pattern */
  #floor-area {
    background-image: radial-gradient(#0F172A 2px, transparent 2px);
    background-size: 28px 28px;
    background-color: #f5ded7;
  }

  /* Timer last-10s warning */
  @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #timer-display.timer-warning { color: var(--error) !important; transform-origin: left center; animation: timerPulse 0.6s ease-in-out infinite; }

  /* Result overlay */
  #result-overlay { display:none; }
  #result-overlay.open { display:flex; }
  #result-overlay .result-card {
    transform: translateY(24px); opacity: 0;
    transition: transform 0.4s var(--ease-out), opacity 0.4s var(--ease-out);
  }
  #result-overlay.shown .result-card { transform: translateY(0); opacity: 1; }
  @keyframes starPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }
  #result-stars .star-pop { display: inline-block; animation: starPop 0.34s var(--ease-out) both; }

  /* Gauge */
  #gauge-track { transition: border-color 0.18s ease; }
  #gauge-track.gauge-hot { border-color: #16A34A; }
  #gauge-fill { transition: height 0.08s linear, background 0.18s ease; }
  .gauge-tick { position:absolute; left:2px; right:2px; height:2px; background:rgba(15,23,42,0.22); z-index:2; pointer-events:none; }
  #target-line { position:absolute; left:0; right:0; background:#994626; height:3px; z-index:3; transition: background 0.18s ease, height 0.18s ease; }
  #gauge-track.gauge-hot #target-line { background:#16A34A; height:4px; }
</style>
</head>
<body style="background:#1a0a05;">

<!-- ══ GAME ══════════════════════════════════════════════════════════════ -->
<div id="game-screen" class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-3" style="background:#FFF8F6;border-bottom:4px solid #0F172A;">
    <div class="font-display text-xl font-bold text-primary italic">ReGrip</div>
    <div class="flex items-center gap-4">
      <div class="font-display text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full text-on-surface-variant animate-pulse" style="background:#FFE9E3;border:2px solid #dfc0b6;">
        SPACE / 클릭 홀드
      </div>
      <!-- Sensor status (filled by bindSensorBadge) -->
      <div id="sensor-badge" class="font-display text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full flex items-center gap-2" style="background:#FFF8F6;border:2px solid #0F172A;"></div>
      <button onclick="confirmExit()" class="font-display font-bold text-sm uppercase tracking-wider px-4 py-2 rounded" style="background:#FFF8F6;border:2px solid #0F172A;box-shadow:2px 2px 0 #0F172A;">
        종료
      </button>
    </div>
  </header>

  <div class="flex-1 flex gap-0">

    <!-- Left HUD -->
    <aside class="w-56 p-5 flex flex-col gap-4 flex-shrink-0" style="background:#FFF8F6;border-right:4px solid #0F172A;">
      <!-- Timer -->
      <div class="rounded-xl p-4" style="background:#fff;border:4px solid #0F172A;box-shadow:4px 4px 0 #0F172A;border-top:6px solid #994626;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">남은 시간</div>
        <div id="timer-display" class="font-display text-5xl font-bold text-primary tabular">1:00</div>
      </div>
      <!-- Score -->
      <div class="rounded-xl p-4" style="background:#fff;border:4px solid #0F172A;box-shadow:4px 4px 0 #0F172A;border-top:6px solid #10B981;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">수집한 캡슐</div>
        <div id="score-display" class="font-display text-5xl font-bold tabular" style="color:#10B981;" aria-live="polite">0</div>
      </div>
      <!-- Hold gauge display -->
      <div class="rounded-xl p-4" style="background:#fff;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">집게 유지</div>
        <div class="flex items-center gap-2">
          <!-- Donut SVG -->
          <svg width="44" height="44" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15.9" stroke="#FFE9E3" stroke-width="5" fill="none"/>
            <circle id="donut-arc" cx="18" cy="18" r="15.9" stroke="#994626" stroke-width="5" fill="none"
                    transform="rotate(-90 18 18)"/>
          </svg>
          <div>
            <div id="hold-secs" class="font-display text-lg font-bold text-on-surface tabular">0.0s</div>
            <div class="font-display text-xs text-on-surface-variant">/ 3.0s</div>
          </div>
        </div>
        <div id="grip-status" class="font-display text-xs font-bold uppercase tracking-wider mt-2 text-on-surface-variant">집게 열림</div>
      </div>
      <!-- Chute -->
      <div class="flex-1 rounded-xl overflow-hidden" style="background:#f0f0f0;border:2px solid #0F172A;min-height:80px;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase p-2 pb-0">획득함</div>
        <div id="chute-items" class="p-2 flex flex-wrap gap-1"></div>
      </div>
      <!-- Instructions -->
      <div class="rounded-lg p-4 text-sm" style="background:#EFF6FF;border:2px dashed #0F172A;">
        <strong class="text-primary block mb-1 font-display text-xs uppercase tracking-wider">훈련 방법</strong>
        80% 이상 3초 유지 → 캡슐 획득!
      </div>
    </aside>

    <!-- Center Viewport -->
    <div id="game-viewport" class="flex-1">

      <!-- Crane Assembly -->
      <div id="crane-assembly" style="width:100px;top:0;">
        <!-- Rail -->
        <div style="height:6px;background:#64748B;border-bottom:2px solid #0F172A;width:100vw;position:absolute;top:0;left:-50vw;"></div>
        <!-- Cable + body + claws -->
        <svg id="crane-svg" width="100" height="160" viewBox="0 0 100 160" fill="none" style="display:block;">
          <!-- Cable -->
          <line id="crane-cable" x1="50" y1="6" x2="50" y2="85" stroke="#0F172A" stroke-width="4"/>
          <!-- Body -->
          <rect x="30" y="85" width="40" height="28" rx="5" fill="#994626" stroke="#0F172A" stroke-width="3"/>
          <circle cx="50" cy="99" r="8" fill="white" stroke="#0F172A" stroke-width="2"/>
          <!-- Prongs container -->
          <g id="claw-group">
            <line id="prong-left"  x1="42" y1="112" x2="28" y2="148" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
            <line id="prong-right" x1="58" y1="112" x2="72" y2="148" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
          </g>
        </svg>
        <!-- Hold donut (overlay) -->
        <div id="hold-donut-wrap" class="absolute opacity-0 transition-opacity duration-200"
             style="top:60px;left:50%;transform:translateX(-50%);">
          <div id="donut-ring" class="relative w-16 h-16 flex items-center justify-center"
               style="background:rgba(255,248,246,0.92);border:3px solid #0F172A;border-radius:50%;">
            <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="14" stroke="#FFE9E3" stroke-width="4" fill="none"/>
              <circle id="donut-arc-claw" cx="18" cy="18" r="14" stroke="#994626" stroke-width="4" fill="none"
                      stroke-dasharray="88" stroke-dashoffset="88" stroke-linecap="round"
                      style="transition:stroke-dashoffset 0.1s linear;"/>
            </svg>
            <span id="donut-text" class="font-display font-bold text-sm text-on-surface z-10">3s</span>
          </div>
        </div>
      </div>

      <!-- Floor / Capsule Area -->
      <div id="floor-area" class="absolute bottom-0 left-0 right-0" style="height:35%;border-top:4px solid #0F172A;">
        <!-- Capsules injected here by JS -->
        <div id="capsule-container" class="absolute inset-0"></div>
        <!-- "Insert Coin" flavor text -->
        <div class="absolute bottom-3 left-1/2 -translate-x-1/2 font-display font-bold text-xl tracking-widest uppercase opacity-20 pointer-events-none text-on-surface">
          INSERT COIN
        </div>
      </div>

    </div>

    <!-- Right Gauge -->
    <aside class="w-28 p-4 flex flex-col items-center flex-shrink-0" style="background:#FFF8F6;border-left:4px solid #0F172A;">
      <div class="font-display text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-3 text-center">악력</div>
      <div class="font-display text-sm text-on-surface-variant mb-1">100%</div>
      <div id="gauge-track" role="meter" aria-label="악력 게이지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
           class="flex-1 w-10 relative rounded-full overflow-hidden" style="background:#F0F9FF;border:2px solid #0F172A;">
        <!-- Scale ticks -->
        <div class="gauge-tick" style="bottom:25%;"></div>
        <div class="gauge-tick" style="bottom:50%;"></div>
        <div class="gauge-tick" style="bottom:75%;"></div>
        <!-- Target line (position set from TARGET_FORCE) -->
        <div id="target-line"></div>
        <div id="target-line-label" class="absolute font-display text-xs font-bold text-primary" style="right:100%;margin-right:4px;white-space:nowrap;">80%</div>
        <div id="gauge-fill" class="absolute bottom-0 left-0 right-0 rounded-full" style="height:0%;background:#994626;"></div>
      </div>
      <div class="mt-2 mb-1 font-display text-sm text-on-surface-variant">0%</div>
      <div id="force-pct" class="font-display text-2xl font-bold text-primary mt-2 tabular">0%</div>
      <span id="force-live" class="sr-only" aria-live="polite"></span>
    </aside>

  </div>
</div>


<!-- ══ RESULT OVERLAY ═══════════════════════════════════════════════════ -->
<div id="result-overlay" class="fixed inset-0 z-50 items-center justify-center p-6" style="background:rgba(15,23,42,0.75);">
  <div class="result-card w-full max-w-md overflow-hidden" style="background:#FFF8F6;border:4px solid #0F172A;box-shadow:8px 8px 0 #0F172A;border-radius:16px;">
    <div class="p-8 flex flex-col items-center gap-3 text-center" style="background:#FFB38E;">
      <div class="w-16 h-16 rounded-full flex items-center justify-center" style="background:#fff;border:3px solid #0F172A;">
        <span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings:'FILL' 1">emoji_events</span>
      </div>
      <h2 class="font-display text-3xl font-bold uppercase tracking-tight text-ink-black">게임 완료</h2>
      <div id="result-stars" class="flex gap-1"></div>
    </div>
    <div class="p-6 grid grid-cols-2 gap-3">
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">획득 캡슐</div>
        <div id="res-score" class="font-display text-3xl font-bold text-primary tabular">0</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">최대 악력</div>
        <div id="res-max" class="font-display text-3xl font-bold text-primary tabular">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">평균 악력</div>
        <div id="res-avg" class="font-display text-3xl font-bold text-primary tabular">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">시도 횟수</div>
        <div id="res-attempts" class="font-display text-3xl font-bold text-primary tabular">0</div>
      </div>
    </div>
    <div id="result-actions" class="px-6 pb-6 flex gap-3">
      <button onclick="restartGame()" class="flex-1 font-display font-bold uppercase tracking-wider py-3 rounded text-white flex items-center justify-center gap-2" style="background:#994626;border:2px solid #0F172A;box-shadow:3px 3px 0 #0F172A;">
        <span class="material-symbols-outlined text-base">replay</span> 다시 플레이
      </button>
      <button id="save-btn" onclick="saveAndHistory()" class="flex-1 font-display font-bold uppercase tracking-wider py-3 rounded flex items-center justify-center gap-2" style="background:#FFF8F6;border:2px solid #0F172A;box-shadow:3px 3px 0 #0F172A;">
        <span class="material-symbols-outlined text-base">save</span> 저장
      </button>
      <button onclick="window.location.href='index.html'" class="font-display font-bold uppercase tracking-wider py-3 px-4 rounded" style="background:#FFF1ED;border:2px solid #0F172A;">
        <span class="material-symbols-outlined text-base">home</span>
      </button>
    </div>

    <!-- Reward confirmation (rest 모드에서 서버가 확정한 보상 표시) -->
    <div id="reward-view" class="px-6 pb-6 pt-2 flex-col items-center gap-4 text-center" style="display:none;">
      <div class="font-display text-xs font-bold tracking-widest uppercase" style="color:var(--success-text);">서버에 저장 완료</div>
      <div class="flex items-baseline justify-center gap-1">
        <span class="font-display text-4xl font-bold text-primary tabular">+</span>
        <span id="reward-xp" class="font-display text-4xl font-bold text-primary tabular">0</span>
        <span class="font-display text-xl font-bold text-primary">XP</span>
      </div>
      <div id="reward-levelup" class="font-display text-lg font-bold px-4 py-1 rounded-full" style="display:none;background:#FEF9C3;color:#CA8A04;border:2px solid #0F172A;">Lv. — 달성!</div>
      <div id="reward-achievements" class="flex flex-wrap gap-2 justify-center"></div>
      <button id="reward-go-btn" onclick="goHistory()" class="w-full font-display font-bold uppercase tracking-wider py-3 rounded text-white flex items-center justify-center gap-2" style="background:#994626;border:2px solid #0F172A;box-shadow:3px 3px 0 #0F172A;">
        <span class="material-symbols-outlined text-base">timeline</span> 기록 보기
      </button>
    </div>
  </div>
</div>


<script src="shared.js"></script>
<script>
// ── Constants ────────────────────────────────────────────────────────────
const GAME_DURATION  = 60;
const TARGET_FORCE   = 80;    // % needed to close claw AND the on-gauge target line (single source)
const HOLD_NEEDED    = 3.0;   // seconds to grab
const CRANE_SPEED    = 180;   // px/second
const CAPSULE_COLORS = ['#F472B6','#10B981','#FBBF24','#60A5FA','#A78BFA'];

// ── State ────────────────────────────────────────────────────────────────
let craneX      = 100;
let craneDir    = 1;       // +1 = right, -1 = left
let gripForce   = 0;
let pressActive = false;
let holdTime    = 0;
let score       = 0;
let timeLeft    = GAME_DURATION;
let running     = true;
let capsules    = [];
let forceSamples = [];
let maxForce    = 0;
let attempts    = 0;
let setDetails  = [];      // per-grab rows for session v2
let wasClamping = false;
let donutBusy   = false;   // guards the early-release feedback window
let ariaAccum   = 0;       // 1s throttle accumulator for aria mirror
let sessionStart = Date.now();
let rafId       = null;
let sensorBadgeUnsub = null;

// ── Reduced motion (settings toggle + OS preference) ─────────────────────────
// Game pages don't call initPage(), so apply the saved reducedMotion setting here
// too — this makes both shared.css's global stop and prefersReducedMotion() honor it.
try {
  const st = DataService.getSettingsSync();
  if (st && st.reducedMotion) document.documentElement.setAttribute('data-reduced-motion', '');
} catch {}
// Real-hardware path: apply saved sensor calibration (games skip initPage which normally does this).
try { SensorService.loadCalibration(); } catch {}
let reducedMotion = prefersReducedMotion();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const upd = () => { reducedMotion = prefersReducedMotion(); };
  if (mq.addEventListener) mq.addEventListener('change', upd);
  else if (mq.addListener) mq.addListener(upd);
}

// ── DOM refs ─────────────────────────────────────────────────────────────
const craneAssembly  = document.getElementById('crane-assembly');
const craneSvg       = document.getElementById('crane-svg');
const clawGroup      = document.getElementById('claw-group');
const holdDonutWrap  = document.getElementById('hold-donut-wrap');
const donutRing      = document.getElementById('donut-ring');
const donutArcClaw   = document.getElementById('donut-arc-claw');
const donutText      = document.getElementById('donut-text');
const donutArcLeft   = document.getElementById('donut-arc');   // sidebar arc
const holdSecsEl     = document.getElementById('hold-secs');
const gaugeFill      = document.getElementById('gauge-fill');
const gaugeTrack     = document.getElementById('gauge-track');
const forcePctEl     = document.getElementById('force-pct');
const forceLive      = document.getElementById('force-live');
const gripStatusEl   = document.getElementById('grip-status');
const timerEl        = document.getElementById('timer-display');
const scoreEl        = document.getElementById('score-display');
const targetLine     = document.getElementById('target-line');
const targetLineLabel = document.getElementById('target-line-label');
const capsuleContainer = document.getElementById('capsule-container');
const chuteItems     = document.getElementById('chute-items');
const viewport       = document.getElementById('game-viewport');

// Gauge target line — derived from TARGET_FORCE (single source with the clamp threshold).
targetLine.style.bottom      = TARGET_FORCE + '%';
targetLineLabel.style.bottom = TARGET_FORCE + '%';
targetLineLabel.textContent  = TARGET_FORCE + '%';

// ── Reduced-motion helper for +1 float ───────────────────────────────────
function floatPlusOne(cx, cy) {
  if (reducedMotion) return;
  const el = document.createElement('div');
  el.className = 'plus-one';
  el.textContent = '+1';
  el.style.left = cx + 'px';
  el.style.top  = cy + 'px';
  viewport.appendChild(el);
  if (el.animate) {
    const a = el.animate(
      [{ transform: 'translate(-50%,-50%) translateY(0)', opacity: 1 },
       { transform: 'translate(-50%,-50%) translateY(-46px)', opacity: 0 }],
      { duration: 600, easing: 'cubic-bezier(0.22,1,0.36,1)' });
    a.onfinish = () => el.remove();
  } else { setTimeout(() => el.remove(), 600); }
}

// ── Capsule management ───────────────────────────────────────────────────
function spawnCapsules() {
  capsuleContainer.innerHTML = '';
  capsules = [];
  const vpW = viewport.clientWidth;
  const count = 3 + Math.floor(Math.random() * 2);
  const spacing = vpW / (count + 1);

  for (let i = 0; i < count; i++) {
    const x = spacing * (i + 1) - 27;
    const color = CAPSULE_COLORS[i % CAPSULE_COLORS.length];
    const el = document.createElement('div');
    el.className = 'capsule';
    el.style.left  = x + 'px';
    el.style.bottom = (5 + Math.random() * 20) + 'px';
    el.style.background = color;
    capsuleContainer.appendChild(el);
    capsules.push({ el, x: x + 27, color, grabbed: false });
  }
}

spawnCapsules();

// ── Input ────────────────────────────────────────────────────────────────
function startPress() { pressActive = true; }
function stopPress()  { pressActive = false; }

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); startPress(); } });
document.addEventListener('keyup',   e => { if (e.code === 'Space') stopPress(); });
document.addEventListener('mousedown', startPress);
document.addEventListener('mouseup',   stopPress);
document.addEventListener('touchstart', e => { e.preventDefault(); startPress(); }, {passive:false});
document.addEventListener('touchend',   stopPress);

const onForce = f => { gripForce = f; };
SensorService.onForceUpdate(onForce);

// ── Find nearest capsule under crane ────────────────────────────────────
function nearestCapsule() {
  let best = null, bestDist = 999;
  for (const c of capsules) {
    if (c.grabbed) continue;
    const dist = Math.abs(craneX - c.x);
    if (dist < bestDist) { bestDist = dist; best = c; }
  }
  return bestDist < 70 ? best : null;
}

// ── Grab capsule ─────────────────────────────────────────────────────────
function grabCapsule(cap) {
  if (!cap || cap.grabbed) return;
  cap.grabbed = true;
  score++;
  attempts++;
  scoreEl.textContent = score;                    // essential (always)
  setDetails.push({ setNum: score, force: Math.round(gripForce), holdSecs: HOLD_NEEDED });

  const capRect = cap.el.getBoundingClientRect();
  cap.el.classList.add('grabbed');
  setTimeout(() => cap.el.remove(), 450);

  // Drop in chute
  const chItem = document.createElement('div');
  chItem.className = 'chute-capsule';
  chItem.style.background = cap.color;
  chuteItems.appendChild(chItem);

  // Juice
  if (!reducedMotion) {
    if (scoreEl.animate) scoreEl.animate(
      [{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }],
      { duration: 320, easing: 'cubic-bezier(0.34,1.56,0.64,1)' });
    if (craneSvg.animate) craneSvg.animate(   // crane body recoil (~2px)
      [{ transform: 'translateY(0)' }, { transform: 'translateY(2px)' }, { transform: 'translateY(0)' }],
      { duration: 180, easing: 'ease-out' });
    const vpRect = viewport.getBoundingClientRect();
    floatPlusOne(capRect.left - vpRect.left + capRect.width / 2,
                 capRect.top  - vpRect.top  + capRect.height / 2);
  }

  // Re-spawn when all grabbed
  setTimeout(() => {
    if (running && capsules.every(c => c.grabbed)) spawnCapsules();
  }, 600);

  holdTime = 0;
}

// ── Timer (paused while tab hidden) ──────────────────────────────────────
const timerInterval = setInterval(() => {
  if (!running || document.hidden) return;
  timeLeft--;
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  timerEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
  if (timeLeft <= 10) timerEl.classList.add('timer-warning');
  if (timeLeft <= 0) endGame();
}, 1000);

// ── Game loop ─────────────────────────────────────────────────────────────
let lastTick = Date.now();

function gameTick() {
  if (!running) { rafId = null; return; }

  const now = Date.now();
  const dt  = (now - lastTick) / 1000;
  lastTick  = now;

  // Simulated grip
  if (SensorService.getMode() === 'simulation') {
    gripForce = pressActive ? Math.min(100, gripForce + 60 * dt)
                            : Math.max(0, gripForce - 50 * dt);
    SensorService.setSimulatedForce(gripForce);
  }

  forceSamples.push(gripForce);
  if (gripForce > maxForce) maxForce = gripForce;

  // Crane horizontal movement
  const vpW = viewport.clientWidth - 50;
  craneX += craneDir * CRANE_SPEED * dt;
  if (craneX > vpW) { craneX = vpW; craneDir = -1; }
  if (craneX < 50)  { craneX = 50;  craneDir = 1;  }
  craneAssembly.style.left = (craneX - 50) + 'px';

  // Claw open / closed — threshold at TARGET_FORCE (same constant as gauge line)
  const clamping = gripForce >= TARGET_FORCE;
  if (clamping) {
    clawGroup.classList.remove('claw-open');
    clawGroup.classList.add('claw-closed');
    gripStatusEl.textContent = '집게 닫힘 — 유지!';
    gripStatusEl.style.color = '#994626';
    holdDonutWrap.style.opacity = '1';
    // Target reached — donut active color + gauge top emphasis (no blur shadow)
    donutArcClaw.style.stroke = '#16A34A';
    donutArcLeft.style.stroke = '#16A34A';
    gaugeTrack.classList.add('gauge-hot');

    holdTime += dt;
    if (holdTime >= HOLD_NEEDED) {
      const cap = nearestCapsule();
      if (cap) { grabCapsule(cap); }
      else     { holdTime = 0; attempts++; }  // completed hold but no capsule under crane
    }
  } else {
    clawGroup.classList.add('claw-open');
    clawGroup.classList.remove('claw-closed');
    gripStatusEl.textContent = '집게 열림';
    gripStatusEl.style.color = '#64748B';
    donutArcClaw.style.stroke = '#994626';
    donutArcLeft.style.stroke = '#994626';
    gaugeTrack.classList.remove('gauge-hot');

    // Early release (had meaningful progress) → donut shake + red border flash once
    if (wasClamping && holdTime > 0.3 && !reducedMotion && !donutBusy) {
      donutBusy = true;
      holdDonutWrap.style.opacity = '1';
      holdDonutWrap.classList.add('donut-shake');
      donutRing.classList.add('donut-flash');
      setTimeout(() => {
        holdDonutWrap.classList.remove('donut-shake');
        donutRing.classList.remove('donut-flash');
        holdDonutWrap.style.opacity = '0';
        donutBusy = false;
      }, 220);
    } else if (!donutBusy) {
      holdDonutWrap.style.opacity = '0';
    }
    holdTime = Math.max(0, holdTime - dt * 1.5);
  }
  wasClamping = clamping;

  // Donut arcs
  const progress = Math.min(holdTime / HOLD_NEEDED, 1);
  const donutCirc = 88;
  donutArcClaw.style.strokeDashoffset = donutCirc * (1 - progress);
  donutText.textContent = Math.ceil(HOLD_NEEDED - holdTime) + 's';

  const sideCirc = 100;
  donutArcLeft.style.strokeDashoffset = sideCirc * (1 - progress);
  holdSecsEl.textContent = holdTime.toFixed(1) + 's';

  // Gauge fill + color state
  gaugeFill.style.height = gripForce + '%';
  forcePctEl.textContent = Math.round(gripForce) + '%';
  gaugeFill.style.background = gripForce >= TARGET_FORCE ? '#16A34A' : '#994626';

  // A11y — meter value + throttled (1s) live mirror for the per-frame force number
  ariaAccum += dt;
  if (ariaAccum >= 1) {
    ariaAccum = 0;
    const fv = Math.round(gripForce);
    gaugeTrack.setAttribute('aria-valuenow', fv);
    if (forceLive) forceLive.textContent = '악력 ' + fv + '퍼센트';
  }

  rafId = requestAnimationFrame(gameTick);
}

function endGame() {
  running = false;
  clearInterval(timerInterval);
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

  const avgF = forceSamples.length
    ? Math.round(forceSamples.reduce((a,b) => a+b,0) / forceSamples.length) : 0;
  // 서버 제약: avgForce ≤ maxForce ≤ 100. 반올림/샘플 경로로 avg가 max를 넘지 않도록 클램프.
  const maxF = Math.min(100, Math.max(Math.round(maxForce), avgF));
  const stars = starsForScore('crane', score);
  const elapsedSec  = Math.round((Date.now() - sessionStart) / 1000);
  const durationMin = Math.max(1, Math.round(elapsedSec / 60));

  // Stars — sequential pop (120ms stagger); no motion under reduced.
  document.getElementById('result-stars').innerHTML =
    [1,2,3].map(i => {
      const on = i <= stars;
      const cls = reducedMotion ? '' : ' star-pop';
      const delay = reducedMotion ? '' : `;animation-delay:${(i-1)*120}ms`;
      return `<span class="material-symbols-outlined text-3xl${cls} ${on?'text-yellow-400':'text-on-surface-variant'}"
        style="font-variation-settings:'FILL' ${on?1:0}${delay}">star</span>`;
    }).join('');

  // Session v2 (schema 2) — includes attempts (총 시도 수) so no data is lost.
  window._sessionResult = {
    date:        new Date().toISOString(),
    gameId:      'crane',
    label:       GAME_DEFS.crane.label,
    durationMin,
    durationSec: elapsedSec,
    sets:        score,              // 크레인 = 캡슐 수
    attempts,                        // 총 시도 수(성공+실패)
    avgForce:    avgF,
    maxForce:    maxF,
    stars,
    setDetails,
    schema:      2,
  };

  const overlay = document.getElementById('result-overlay');
  overlay.classList.add('open');
  requestAnimationFrame(() => overlay.classList.add('shown'));   // slideUp entrance

  animateCount(document.getElementById('res-score'),    score,                { duration: 700 });
  animateCount(document.getElementById('res-max'),      maxF,                 { suffix: '%', duration: 700 });
  animateCount(document.getElementById('res-avg'),      avgF,                 { suffix: '%', duration: 700 });
  animateCount(document.getElementById('res-attempts'), attempts,             { duration: 700 });
}

function restartGame() { window.location.reload(); }

// ── Save + server-reward flow ────────────────────────────────────────────────
// shared.js 미반영 상태에서도 안전: isRest()이 없으면 local 모드로 폴백.
function restMode() { return typeof DataService.isRest === 'function' && DataService.isRest(); }

function goHistory() { window.location.href = 'history.html'; }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// 게임 화면용 간이 에러 토스트 (shared.css의 .retro-toast 재사용).
function showSaveError(msg) {
  const t = document.createElement('div');
  t.className = 'retro-toast';
  t.setAttribute('role', 'alert');
  t.style.borderColor = 'var(--error)';
  t.style.color = 'var(--error)';
  t.innerHTML = `<span class="material-symbols-outlined" style="color:var(--error)">error</span>${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// 서버가 확정한 보상을 결과 오버레이에 표시. reduced-motion이면 animateCount가 스냅.
function showReward(res) {
  document.getElementById('result-actions').style.display = 'none';
  const rv = document.getElementById('reward-view');
  rv.style.display = 'flex';

  animateCount(document.getElementById('reward-xp'), res.xpAwarded || 0, { duration: 700 });

  if (res.levelUp) {
    const lu = document.getElementById('reward-levelup');
    lu.textContent = `Lv. ${res.level} 달성!`;
    lu.style.display = 'inline-block';
  }

  const chips = Array.isArray(res.unlockedAchievements) ? res.unlockedAchievements : [];
  document.getElementById('reward-achievements').innerHTML = chips.map(a => {
    const rs = (typeof RARITY_STYLE !== 'undefined' && RARITY_STYLE[a.rarity]) || { color: '#994626', bg: '#FFE9E3' };
    return `<span class="font-display text-xs font-bold px-3 py-1 rounded-full" style="background:${rs.bg};color:${rs.color};border:2px solid #0F172A;">`
      + `${esc(a.title)} +${Number(a.rewardXp) || 0} XP</span>`;
  }).join('');

  // 추가로 읽을 내용(레벨업/업적)이 없으면 1.5초 후 자동 이동, 있으면 버튼 클릭 대기.
  if (!res.levelUp && chips.length === 0) setTimeout(goHistory, 1500);
}

let saving = false;
async function saveAndHistory() {
  if (saving) return;                       // 중복 POST 방지
  saving = true;
  const btn = document.getElementById('save-btn');
  if (btn) { btn.disabled = true; btn.style.opacity = '0.6'; btn.style.cursor = 'not-allowed'; }

  const res = window._sessionResult ? await DataService.saveSession(window._sessionResult) : undefined;

  if (restMode()) {
    if (res) {
      showReward(res);                      // 서버 확정 보상 표시
    } else {
      // 서버 저장 실패 — 버튼 재활성화 + 안내(로컬에는 이미 폴백 저장됨).
      saving = false;
      if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
      showSaveError('서버 저장 실패, 로컬에 보관됨');
    }
  } else {
    // local 모드(반환값 undefined) — 기존 동작 그대로 바로 history로 이동.
    goHistory();
  }
}

function confirmExit() {
  openConfirmModal({
    title: '게임 종료',
    body: '지금 종료하면 이번 세션은 저장되지 않습니다. 종료할까요?',
    confirmLabel: '종료',
    cancelLabel: '계속하기',
    danger: true,
    onConfirm: () => { cleanup(); window.location.href = 'training.html'; },
  });
}

// ── Cleanup + visibility gating (optimize-web-animations) ────────────────────
function cleanup() {
  running = false;
  clearInterval(timerInterval);
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (sensorBadgeUnsub) { sensorBadgeUnsub(); sensorBadgeUnsub = null; }
  SensorService.offForceUpdate(onForce);
}
window.addEventListener('pagehide', cleanup);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  } else if (running && rafId === null) {
    lastTick = Date.now();   // avoid a dt spike after resume
    rafId = requestAnimationFrame(gameTick);
  }
});

// ── Init ──────────────────────────────────────────────────────────────────
injectFeedbackModal();
sensorBadgeUnsub = bindSensorBadge(document.getElementById('sensor-badge'));
clawGroup.classList.add('claw-open');   // start claw open
rafId = requestAnimationFrame(gameTick);
</script>
</body>
