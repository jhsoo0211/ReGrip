<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReGrip — 크레인 게임</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=DM+Sans:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script id="tailwind-config">
tailwind.config = {
  theme: { extend: {
    colors: {
      primary: '#994626', surface: '#FFF8F6', 'surface-container': '#FFE9E3',
      'on-surface': '#251915', 'on-surface-variant': '#58423a',
      'background-sky': '#F0F9FF', 'ink-black': '#0F172A',
    },
    fontFamily: { display: ['Space Grotesk'], body: ['DM Sans'] },
  }}
};
</script>
<style>
  /* Viewport */
  #game-viewport {
    background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 40%, #FFF8F6 100%);
    position: relative; overflow: hidden;
  }

  /* Crane assembly moves horizontally */
  #crane-assembly {
    position: absolute;
    top: 0;
    transition: left 0.05s linear;
  }

  /* Claw prong open/close via transform */
  #prong-left  { transform-origin: top right;  transition: transform 0.2s ease; }
  #prong-right { transform-origin: top left;   transition: transform 0.2s ease; }
  .claw-open   #prong-left  { transform: rotate(-30deg); }
  .claw-open   #prong-right { transform: rotate(30deg); }
  .claw-closed #prong-left  { transform: rotate(5deg);  }
  .claw-closed #prong-right { transform: rotate(-5deg); }

  /* Hold donut (SVG) */
  #donut-arc {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    transition: stroke-dashoffset 0.1s linear;
    stroke-linecap: round;
  }

  /* Capsules */
  .capsule {
    position: absolute;
    width: 54px; height: 72px;
    border-radius: 50%;
    border: 4px solid #0F172A;
    box-shadow: 3px 3px 0 #0F172A;
    cursor: default;
    transition: transform 0.3s, opacity 0.3s;
    overflow: hidden;
  }
  .capsule::before {
    content:''; position:absolute;
    top:0; left:0; right:0; height:50%;
    background:rgba(255,255,255,0.3);
    border-radius:50% 50% 0 0 / 60% 60% 40% 40%;
  }
  .capsule.grabbed {
    animation: capsuleGrab 0.4s ease forwards;
  }
  @keyframes capsuleGrab {
    0%   { transform: translateY(0); opacity:1; }
    60%  { transform: translateY(-40px) scale(0.8); opacity:0.8; }
    100% { transform: translateY(-80px) scale(0.5); opacity:0; }
  }

  /* Capsule drop in chute */
  .chute-capsule {
    width:28px; height:36px; border-radius:50%;
    border:2px solid #0F172A;
    animation: chuteSlide 0.5s ease forwards;
  }
  @keyframes chuteSlide {
    from { transform: translateY(-40px); opacity:0; }
    to   { transform: translateY(0);    opacity:1; }
  }

  /* Floor dot pattern */
  #floor-area {
    background-image: radial-gradient(#0F172A 2px, transparent 2px);
    background-size: 28px 28px;
    background-color: #f5ded7;
  }

  /* Result overlay */
  #result-overlay { display:none; }
  #result-overlay.open { display:flex; }

  /* Gauge */
  #gauge-fill { transition: height 0.08s linear; }
  #target-line { position:absolute; left:0; right:0; background:#994626; height:3px; }
</style>
</head>
<body style="background:#1a0a05;">

<!-- ══ GAME ══════════════════════════════════════════════════════════════ -->
<div id="game-screen" class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-3" style="background:#FFF8F6;border-bottom:4px solid #0F172A;">
    <div class="font-display text-xl font-bold text-primary italic">ReGrip</div>
    <div class="flex items-center gap-4">
      <div class="font-display text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full text-on-surface-variant animate-pulse" style="background:#FFE9E3;border:2px solid #dfc0b6;">
        SPACE / 클릭 홀드
      </div>
      <div class="font-display text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full flex items-center gap-2" style="background:#DCFCE7;border:2px solid #0F172A;">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse inline-block"></span>
        시뮬레이션
      </div>
      <button onclick="confirmExit()" class="font-display font-bold text-sm uppercase tracking-wider px-4 py-2 rounded" style="background:#FFF8F6;border:2px solid #0F172A;box-shadow:2px 2px 0 #0F172A;">
        종료
      </button>
    </div>
  </header>

  <div class="flex-1 flex gap-0">

    <!-- Left HUD -->
    <aside class="w-56 p-5 flex flex-col gap-4 flex-shrink-0" style="background:#FFF8F6;border-right:4px solid #0F172A;">
      <!-- Timer -->
      <div class="rounded-xl p-4" style="background:#fff;border:4px solid #0F172A;box-shadow:4px 4px 0 #0F172A;border-top:6px solid #994626;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">남은 시간</div>
        <div id="timer-display" class="font-display text-5xl font-bold text-primary">1:00</div>
      </div>
      <!-- Score -->
      <div class="rounded-xl p-4" style="background:#fff;border:4px solid #0F172A;box-shadow:4px 4px 0 #0F172A;border-top:6px solid #10B981;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">수집한 캡슐</div>
        <div id="score-display" class="font-display text-5xl font-bold" style="color:#10B981;">0</div>
      </div>
      <!-- Hold gauge display -->
      <div class="rounded-xl p-4" style="background:#fff;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">집게 유지</div>
        <div class="flex items-center gap-2">
          <!-- Donut SVG -->
          <svg width="44" height="44" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15.9" stroke="#FFE9E3" stroke-width="5" fill="none"/>
            <circle id="donut-arc" cx="18" cy="18" r="15.9" stroke="#994626" stroke-width="5" fill="none"
                    transform="rotate(-90 18 18)"/>
          </svg>
          <div>
            <div id="hold-secs" class="font-display text-lg font-bold text-on-surface">0.0s</div>
            <div class="font-display text-xs text-on-surface-variant">/ 3.0s</div>
          </div>
        </div>
        <div id="grip-status" class="font-display text-xs font-bold uppercase tracking-wider mt-2 text-on-surface-variant">집게 열림</div>
      </div>
      <!-- Chute -->
      <div class="flex-1 rounded-xl overflow-hidden" style="background:#f0f0f0;border:2px solid #0F172A;min-height:80px;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase p-2 pb-0">획득함</div>
        <div id="chute-items" class="p-2 flex flex-wrap gap-1"></div>
      </div>
      <!-- Instructions -->
      <div class="rounded-lg p-4 text-sm" style="background:#EFF6FF;border:2px dashed #0F172A;">
        <strong class="text-primary block mb-1 font-display text-xs uppercase tracking-wider">훈련 방법</strong>
        80% 이상 3초 유지 → 캡슐 획득!
      </div>
    </aside>

    <!-- Center Viewport -->
    <div id="game-viewport" class="flex-1">

      <!-- Crane Assembly -->
      <div id="crane-assembly" style="width:100px;top:0;">
        <!-- Rail -->
        <div style="height:6px;background:#64748B;border-bottom:2px solid #0F172A;width:100vw;position:absolute;top:0;left:-50vw;"></div>
        <!-- Cable + body + claws -->
        <svg id="crane-svg" width="100" height="160" viewBox="0 0 100 160" fill="none" style="display:block;">
          <!-- Cable -->
          <line id="crane-cable" x1="50" y1="6" x2="50" y2="85" stroke="#0F172A" stroke-width="4"/>
          <!-- Body -->
          <rect x="30" y="85" width="40" height="28" rx="5" fill="#994626" stroke="#0F172A" stroke-width="3"/>
          <circle cx="50" cy="99" r="8" fill="white" stroke="#0F172A" stroke-width="2"/>
          <!-- Prongs container -->
          <g id="claw-group">
            <line id="prong-left"  x1="42" y1="112" x2="28" y2="148" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
            <line id="prong-right" x1="58" y1="112" x2="72" y2="148" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
          </g>
        </svg>
        <!-- Hold donut (overlay) -->
        <div id="hold-donut-wrap" class="absolute opacity-0 transition-opacity duration-200"
             style="top:60px;left:50%;transform:translateX(-50%);">
          <div class="relative w-16 h-16 flex items-center justify-center"
               style="background:rgba(255,248,246,0.92);border:3px solid #0F172A;border-radius:50%;">
            <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 36 36">
              <circle cx="18" cy="18" r="14" stroke="#FFE9E3" stroke-width="4" fill="none"/>
              <circle id="donut-arc-claw" cx="18" cy="18" r="14" stroke="#994626" stroke-width="4" fill="none"
                      stroke-dasharray="88" stroke-dashoffset="88" stroke-linecap="round"
                      style="transition:stroke-dashoffset 0.1s linear;"/>
            </svg>
            <span id="donut-text" class="font-display font-bold text-sm text-on-surface z-10">3s</span>
          </div>
        </div>
      </div>

      <!-- Floor / Capsule Area -->
      <div id="floor-area" class="absolute bottom-0 left-0 right-0" style="height:35%;border-top:4px solid #0F172A;">
        <!-- Capsules injected here by JS -->
        <div id="capsule-container" class="absolute inset-0"></div>
        <!-- "Insert Coin" flavor text -->
        <div class="absolute bottom-3 left-1/2 -translate-x-1/2 font-display font-bold text-xl tracking-widest uppercase opacity-20 pointer-events-none text-on-surface">
          INSERT COIN
        </div>
      </div>

    </div>

    <!-- Right Gauge -->
    <aside class="w-28 p-4 flex flex-col items-center flex-shrink-0" style="background:#FFF8F6;border-left:4px solid #0F172A;">
      <div class="font-display text-xs font-bold uppercase tracking-widest text-on-surface-variant mb-3 text-center">악력</div>
      <div class="font-display text-sm text-on-surface-variant mb-1">100%</div>
      <div class="flex-1 w-10 relative rounded-full overflow-hidden" style="background:#F0F9FF;border:2px solid #0F172A;">
        <!-- 80% target line -->
        <div id="target-line" style="bottom:80%;"></div>
        <div class="absolute font-display text-xs font-bold text-primary" style="bottom:80%;right:100%;margin-right:4px;white-space:nowrap;">80%</div>
        <div id="gauge-fill" class="absolute bottom-0 left-0 right-0 rounded-full" style="height:0%;background:#994626;"></div>
      </div>
      <div class="mt-2 mb-1 font-display text-sm text-on-surface-variant">0%</div>
      <div id="force-pct" class="font-display text-2xl font-bold text-primary mt-2">0%</div>
    </aside>

  </div>
</div>


<!-- ══ RESULT OVERLAY ═══════════════════════════════════════════════════ -->
<div id="result-overlay" class="fixed inset-0 z-50 items-center justify-center p-6" style="background:rgba(15,23,42,0.75);">
  <div class="w-full max-w-md overflow-hidden" style="background:#FFF8F6;border:4px solid #0F172A;box-shadow:8px 8px 0 #0F172A;border-radius:16px;">
    <div class="p-8 flex flex-col items-center gap-3 text-center" style="background:#FFB38E;">
      <div class="w-16 h-16 rounded-full flex items-center justify-center" style="background:#fff;border:3px solid #0F172A;">
        <span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings:'FILL' 1">emoji_events</span>
      </div>
      <h2 class="font-display text-3xl font-bold uppercase tracking-tight text-ink-black">게임 완료!</h2>
      <div id="result-stars" class="flex gap-1"></div>
    </div>
    <div class="p-6 grid grid-cols-2 gap-3">
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">획득 캡슐</div>
        <div id="res-score" class="font-display text-3xl font-bold text-primary">0</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">최대 악력</div>
        <div id="res-max" class="font-display text-3xl font-bold text-primary">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">평균 악력</div>
        <div id="res-avg" class="font-display text-3xl font-bold text-primary">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:#FFE9E3;border:2px solid #0F172A;">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">시도 횟수</div>
        <div id="res-attempts" class="font-display text-3xl font-bold text-primary">0</div>
      </div>
    </div>
    <div class="px-6 pb-6 flex gap-3">
      <button onclick="restartGame()" class="flex-1 font-display font-bold uppercase tracking-wider py-3 rounded text-white flex items-center justify-center gap-2" style="background:#994626;border:2px solid #0F172A;box-shadow:3px 3px 0 #0F172A;">
        <span class="material-symbols-outlined text-base">replay</span> 다시 플레이
      </button>
      <button onclick="saveAndHistory()" class="flex-1 font-display font-bold uppercase tracking-wider py-3 rounded flex items-center justify-center gap-2" style="background:#FFF8F6;border:2px solid #0F172A;box-shadow:3px 3px 0 #0F172A;">
        <span class="material-symbols-outlined text-base">save</span> 저장
      </button>
      <button onclick="window.location.href='index.html'" class="font-display font-bold uppercase tracking-wider py-3 px-4 rounded" style="background:#FFF1ED;border:2px solid #0F172A;">
        <span class="material-symbols-outlined text-base">home</span>
      </button>
    </div>
  </div>
</div>


<script src="shared.js"></script>
<script>
// ── Constants ────────────────────────────────────────────────────────────
const GAME_DURATION  = 60;
const TARGET_FORCE   = 80;    // % needed to close claw
const HOLD_NEEDED    = 3.0;   // seconds to grab
const CRANE_SPEED    = 180;   // px/second
const CAPSULE_COLORS = ['#F472B6','#10B981','#FBBF24','#60A5FA','#A78BFA'];

// ── State ────────────────────────────────────────────────────────────────
let craneX      = 100;
let craneDir    = 1;       // +1 = right, -1 = left
let gripForce   = 0;
let pressActive = false;
let holdTime    = 0;
let score       = 0;
let timeLeft    = GAME_DURATION;
let running     = true;
let capsules    = [];
let forceSamples = [];
let maxForce    = 0;
let attempts    = 0;
let sessionStart = Date.now();

// ── DOM refs ─────────────────────────────────────────────────────────────
const craneAssembly  = document.getElementById('crane-assembly');
const clawGroup      = document.getElementById('claw-group');
const holdDonutWrap  = document.getElementById('hold-donut-wrap');
const donutArcClaw   = document.getElementById('donut-arc-claw');
const donutText      = document.getElementById('donut-text');
const donutArcLeft   = document.getElementById('donut-arc');   // sidebar arc
const holdSecsEl     = document.getElementById('hold-secs');
const gaugeFill      = document.getElementById('gauge-fill');
const forcePctEl     = document.getElementById('force-pct');
const gripStatusEl   = document.getElementById('grip-status');
const timerEl        = document.getElementById('timer-display');
const scoreEl        = document.getElementById('score-display');
const capsuleContainer = document.getElementById('capsule-container');
const chuteItems     = document.getElementById('chute-items');
const viewport       = document.getElementById('game-viewport');

// ── Capsule management ───────────────────────────────────────────────────
function spawnCapsules() {
  capsuleContainer.innerHTML = '';
  capsules = [];
  const vpW = viewport.clientWidth;
  const count = 3 + Math.floor(Math.random() * 2);
  const spacing = vpW / (count + 1);

  for (let i = 0; i < count; i++) {
    const x = spacing * (i + 1) - 27;
    const color = CAPSULE_COLORS[i % CAPSULE_COLORS.length];
    const el = document.createElement('div');
    el.className = 'capsule';
    el.style.left  = x + 'px';
    el.style.bottom = (5 + Math.random() * 20) + 'px';
    el.style.background = color;
    capsuleContainer.appendChild(el);
    capsules.push({ el, x: x + 27, color, grabbed: false });
  }
}

spawnCapsules();

// ── Input ────────────────────────────────────────────────────────────────
function startPress() { pressActive = true; }
function stopPress()  { pressActive = false; }

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); startPress(); } });
document.addEventListener('keyup',   e => { if (e.code === 'Space') stopPress(); });
document.addEventListener('mousedown', startPress);
document.addEventListener('mouseup',   stopPress);
document.addEventListener('touchstart', e => { e.preventDefault(); startPress(); }, {passive:false});
document.addEventListener('touchend',   stopPress);

SensorService.onForceUpdate(f => { gripForce = f; });

// ── Find nearest capsule under crane ────────────────────────────────────
function nearestCapsule() {
  let best = null, bestDist = 999;
  for (const c of capsules) {
    if (c.grabbed) continue;
    const dist = Math.abs(craneX - c.x);
    if (dist < bestDist) { bestDist = dist; best = c; }
  }
  return bestDist < 70 ? best : null;
}

// ── Grab capsule ─────────────────────────────────────────────────────────
function grabCapsule(cap) {
  if (!cap || cap.grabbed) return;
  cap.grabbed = true;
  score++;
  attempts++;
  scoreEl.textContent = score;

  cap.el.classList.add('grabbed');
  setTimeout(() => cap.el.remove(), 450);

  // Drop in chute
  const chItem = document.createElement('div');
  chItem.className = 'chute-capsule';
  chItem.style.background = cap.color;
  chuteItems.appendChild(chItem);

  // Re-spawn when all grabbed
  setTimeout(() => {
    if (running && capsules.every(c => c.grabbed)) spawnCapsules();
  }, 600);

  holdTime = 0;
}

// ── Timer ─────────────────────────────────────────────────────────────────
const timerInterval = setInterval(() => {
  if (!running) return;
  timeLeft--;
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  timerEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
  if (timeLeft <= 0) endGame();
}, 1000);

// ── Game loop ─────────────────────────────────────────────────────────────
let lastTick = Date.now();

function gameTick() {
  if (!running) return;

  const now = Date.now();
  const dt  = (now - lastTick) / 1000;
  lastTick  = now;

  // Simulated grip
  if (SensorService.getMode() === 'simulation') {
    if (pressActive) {
      gripForce = Math.min(100, gripForce + 60 * dt);
    } else {
      gripForce = Math.max(0, gripForce - 50 * dt);
    }
    SensorService.setSimulatedForce(gripForce);
  }

  forceSamples.push(gripForce);
  if (gripForce > maxForce) maxForce = gripForce;

  // Crane horizontal movement
  const vpW = viewport.clientWidth - 50;
  craneX += craneDir * CRANE_SPEED * dt;
  if (craneX > vpW) { craneX = vpW; craneDir = -1; }
  if (craneX < 50)  { craneX = 50;  craneDir = 1;  }
  craneAssembly.style.left = (craneX - 50) + 'px';

  // Claw open / closed
  const clamping = gripForce >= TARGET_FORCE;
  if (clamping) {
    clawGroup.classList.remove('claw-open');
    clawGroup.classList.add('claw-closed');
    gripStatusEl.textContent = '집게 닫힘 — 유지!';
    gripStatusEl.style.color = '#994626';
    holdDonutWrap.style.opacity = '1';

    holdTime += dt;
    if (holdTime >= HOLD_NEEDED) {
      const cap = nearestCapsule();
      if (cap) { grabCapsule(cap); attempts = Math.max(0, attempts); }
      else     { holdTime = 0; attempts++; }  // missed
    }
  } else {
    clawGroup.classList.add('claw-open');
    clawGroup.classList.remove('claw-closed');
    gripStatusEl.textContent = '집게 열림';
    gripStatusEl.style.color = '#64748B';
    holdDonutWrap.style.opacity = '0';
    holdTime = Math.max(0, holdTime - dt * 1.5);
  }

  // Donut arcs
  const progress = Math.min(holdTime / HOLD_NEEDED, 1);
  const donutCirc = 88;
  donutArcClaw.style.strokeDashoffset = donutCirc * (1 - progress);
  donutText.textContent = Math.ceil(HOLD_NEEDED - holdTime) + 's';

  const sideCirc = 100;
  donutArcLeft.style.strokeDashoffset = sideCirc * (1 - progress);
  holdSecsEl.textContent = holdTime.toFixed(1) + 's';

  // Gauge
  gaugeFill.style.height = gripForce + '%';
  forcePctEl.textContent = Math.round(gripForce) + '%';

  // Gauge fill color changes above target
  gaugeFill.style.background = gripForce >= TARGET_FORCE ? '#16A34A' : '#994626';

  requestAnimationFrame(gameTick);
}

function endGame() {
  running = false;
  clearInterval(timerInterval);

  const avgF = forceSamples.length
    ? Math.round(forceSamples.reduce((a,b) => a+b,0) / forceSamples.length) : 0;
  const stars = score >= 8 ? 3 : score >= 4 ? 2 : 1;

  document.getElementById('res-score').textContent    = score;
  document.getElementById('res-max').textContent      = Math.round(maxForce) + '%';
  document.getElementById('res-avg').textContent      = avgF + '%';
  document.getElementById('res-attempts').textContent = attempts;
  document.getElementById('result-stars').innerHTML   =
    [1,2,3].map(i => `<span class="material-symbols-outlined text-3xl ${i<=stars?'text-yellow-400':'text-on-surface-variant'}"
      style="font-variation-settings:'FILL' ${i<=stars?1:0}">star</span>`).join('');

  window._sessionResult = {
    date:       new Date().toISOString(),
    label:      '크레인 게임',
    durationMin: Math.round((Date.now() - sessionStart) / 60000) || 1,
    sets:       score,
    avgForce:   avgF,
    maxForce:   Math.round(maxForce),
    stars,
  };

  document.getElementById('result-overlay').classList.add('open');
}

function restartGame() { window.location.reload(); }

function saveAndHistory() {
  if (window._sessionResult) DataService.saveSession(window._sessionResult);
  window.location.href = 'history.html';
}

function confirmExit() {
