<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReGrip — 크레인 게임</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script src="tailwind-config.js"></script>
<style>
  /* Viewport */
  #game-viewport {
    background: linear-gradient(180deg, #E0F2FE 0%, #F0F9FF 40%, #FFF8F6 100%);
    position: relative; overflow: hidden;
  }

  /* Crane assembly — moves horizontally via transform (no layout trigger) */
  #crane-assembly { position: absolute; top: 0; left: 0; width: 100px; will-change: transform; }

  /* Trolley (fixed motor box at the rail) */
  #trolley {
    position: absolute; top: 1px; left: 50%; transform: translateX(-50%);
    width: 48px; height: 18px; background: #994626; border: 2px solid #0F172A;
    border-radius: 3px; z-index: 3;
  }
  /* Stretchable cable (height animated per-frame) */
  #crane-cable {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 63px; background: #0F172A; z-index: 1;
  }
  /* Claw unit — descends via translateY (transform only) */
  #claw-unit { position: absolute; top: -6px; left: 0; width: 100px; z-index: 2; will-change: transform; }
  #claw-unit.claw-miss { animation: clawMiss 0.32s ease-in-out; }
  @keyframes clawMiss {
    0%,100% { }
    20% { margin-left: -5px; }
    40% { margin-left: 5px; }
    60% { margin-left: -4px; }
    80% { margin-left: 4px; }
  }

  /* Claw prong open/close via transform */
  #prong-left  { transform-origin: top right;  transition: transform 0.2s ease; }
  #prong-right { transform-origin: top left;   transition: transform 0.2s ease; }
  .claw-open   #prong-left  { transform: rotate(-30deg); }
  .claw-open   #prong-right { transform: rotate(30deg); }
  .claw-closed #prong-left  { transform: rotate(5deg);  }
  .claw-closed #prong-right { transform: rotate(-5deg); }

  /* Carried capsule (attached under the claw) */
  #carried-capsule {
    display: none; position: absolute; top: 126px; left: 50%; transform: translateX(-50%);
    width: 46px; height: 60px; border-radius: 50%;
    border: 4px solid #0F172A; box-shadow: 3px 3px 0 #0F172A; z-index: 1; overflow: hidden;
  }
  #carried-capsule::before {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background:rgba(255,255,255,0.3); border-radius:50% 50% 0 0 / 60% 60% 40% 40%;
  }

  /* Hold donut (SVG) */
  #donut-arc {
    stroke-dasharray: 100; stroke-dashoffset: 100;
    transition: stroke-dashoffset 0.1s linear, stroke 0.18s ease; stroke-linecap: round;
  }
  #donut-arc-claw { transition: stroke-dashoffset 0.1s linear, stroke 0.18s ease; }

  /* Hold donut early-release feedback */
  @keyframes donutShake {
    0%,100% { transform: translateX(-50%); }
    20% { transform: translateX(-50%) translateX(-4px); }
    40% { transform: translateX(-50%) translateX(4px); }
    60% { transform: translateX(-50%) translateX(-3px); }
    80% { transform: translateX(-50%) translateX(3px); }
  }
  #hold-donut-wrap.donut-shake { animation: donutShake 0.2s ease-in-out; }
  #donut-ring.donut-flash { border-color: var(--error) !important; }

  /* Phase chip — current-step guidance */
  #phase-chip {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 15; padding: 8px 18px; border-radius: 999px;
    background: rgba(255,255,255,0.65); backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5);
    border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 24px rgba(42,74,111,0.18);
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; color: #12263A;
    white-space: nowrap; max-width: 92%; text-align: center; overflow: hidden; text-overflow: ellipsis;
  }
  #phase-chip.chip-fail { background: #FEE2E2; border-color: var(--error); color: var(--error); }
  #phase-chip.chip-drop { background: #DCFCE7; border-color: #16A34A; color: #166534; }

  /* Capsules */
  .capsule {
    position: absolute; width: 54px; height: 72px; border-radius: 50%;
    border: 4px solid #0F172A; box-shadow: 3px 3px 0 #0F172A; cursor: default;
    transition: bottom 0.5s cubic-bezier(0.5,0,0.75,0), opacity 0.2s; overflow: hidden;
  }
  .capsule::before {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background:rgba(255,255,255,0.3); border-radius:50% 50% 0 0 / 60% 60% 40% 40%;
  }

  /* Flying capsule (drop-to-chute / fail-drop juice; positioned in viewport coords) */
  .fly-capsule {
    position: absolute; width: 40px; height: 52px; border-radius: 50%;
    border: 4px solid #0F172A; box-shadow: 3px 3px 0 #0F172A;
    transform: translate(-50%,-50%); z-index: 14; pointer-events: none; overflow: hidden;
  }

  /* Chute (배출구) structure */
  #chute-zone { position: absolute; left: 16px; bottom: 0; width: 104px; height: 44%; z-index: 6; pointer-events: none; }
  #chute-zone .chute-wall {
    position: absolute; top: 14px; bottom: 0; left: 0; right: 0;
    background: #FDE68A; border: 3px solid #0F172A; border-radius: 0 0 10px 10px;
  }
  #chute-zone .chute-top {
    position: absolute; top: 0; left: 0; right: 0; height: 14px;
    background: #64748B; border: 3px solid #0F172A; border-radius: 8px 8px 0 0;
  }
  #chute-zone .chute-hole {
    position: absolute; top: 14px; left: 10px; right: 10px; height: 16px;
    background: #0F172A; box-shadow: inset 0 5px 7px rgba(0,0,0,0.55); z-index: 2;
  }
  #chute-zone .chute-label {
    position: absolute; top: 44px; left: 0; right: 0; text-align: center;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 3px;
    font-size: 16px; color: #0F172A;
  }

  /* Floating +1 label */
  .plus-one {
    position: absolute; z-index: 20; pointer-events: none;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px;
    color: #10B981; text-shadow: 2px 2px 0 #0F172A; transform: translate(-50%, -50%);
  }

  /* Chute pickup mini-capsule (획득함) */
  .chute-capsule {
    width:28px; height:36px; border-radius:50%; border:2px solid #0F172A;
    animation: chuteSlide 0.5s ease forwards;
  }
  @keyframes chuteSlide {
    0%   { transform: translateY(-40px); opacity:0; }
    70%  { transform: translateY(4px);   opacity:1; }
    100% { transform: translateY(0);     opacity:1; }
  }

  /* Floor dot pattern */
  #floor-area {
    background-image: radial-gradient(#0F172A 2px, transparent 2px);
    background-size: 28px 28px; background-color: #f5ded7;
  }

  /* Timer last-10s warning */
  @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #timer-display.timer-warning { color: var(--error) !important; transform-origin: left center; animation: timerPulse 0.6s ease-in-out infinite; }

  /* Result overlay */
  #result-overlay { display:none; }
  #result-overlay.open { display:flex; }
  #result-overlay .result-card {
    transform: translateY(24px); opacity: 0;
    transition: transform 0.4s var(--ease-out), opacity 0.4s var(--ease-out);
  }
  #result-overlay.shown .result-card { transform: translateY(0); opacity: 1; }
  @keyframes starPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }
  #result-stars .star-pop { display: inline-block; animation: starPop 0.34s var(--ease-out) both; }

  /* Gauge */
  #gauge-track { transition: border-color 0.18s ease; }
  #gauge-track.gauge-hot { border-color: #16A34A; }
  #gauge-fill { transition: height 0.08s linear, background 0.18s ease; }
  .gauge-tick { position:absolute; left:2px; right:2px; height:2px; background:rgba(18,38,58,0.22); z-index:2; pointer-events:none; }
  #target-line { position:absolute; left:0; right:0; background:var(--primary); height:3px; z-index:3; transition: background 0.18s ease, bottom 0.25s ease; }
  #target-line-label { transition: color 0.18s ease, bottom 0.25s ease; }
</style>
</head>
<body style="background:#12263A;">

<!-- ══ GAME ══════════════════════════════════════════════════════════════ -->
<div id="game-screen" class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-3" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid rgba(255,255,255,0.65);">
    <div class="font-display text-xl font-bold text-primary italic">ReGrip</div>
    <div class="flex items-center gap-4">
      <div class="game-hud-hint font-display text-xs font-bold px-3 py-1 rounded-full text-on-surface-variant animate-pulse" style="background:rgba(255,255,255,0.5);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);">
        SPACE / 클릭 홀드
      </div>
      <!-- Sensor status (filled by shell bindSensorBadge) -->
      <div id="sensor-badge" class="font-display text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2" style="background:rgba(255,255,255,0.5);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);"></div>
      <button id="exit-btn" class="font-display font-bold text-sm px-4 py-2 rounded-full" style="background:rgba(255,255,255,0.5);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 4px 16px rgba(42,74,111,0.08);">
        종료
      </button>
    </div>
  </header>

  <div class="game-layout flex-1 flex gap-0">

    <!-- Left HUD -->
    <aside class="game-hud-left w-56 p-5 flex flex-col gap-4 flex-shrink-0" style="background:rgba(255,255,255,0.4);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-right:1px solid rgba(255,255,255,0.65);">
      <!-- Timer -->
      <div class="rounded-xl p-4" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 8px 32px rgba(42,74,111,0.2);border-top:4px solid var(--primary);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">남은 시간</div>
        <div id="timer-display" class="font-display text-5xl font-bold text-primary tabular">1:00</div>
      </div>
      <!-- Score -->
      <div class="rounded-xl p-4" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 8px 32px rgba(42,74,111,0.2);border-top:4px solid #10B981;">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">수집한 캡슐</div>
        <div id="score-display" class="font-display text-5xl font-bold tabular" style="color:#10B981;" aria-live="polite">0</div>
      </div>
      <!-- Hold gauge display -->
      <div class="rounded-xl p-4" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 4px 16px rgba(42,74,111,0.08);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-2">집게 유지</div>
        <div class="flex items-center gap-2">
          <!-- Donut SVG -->
          <svg width="44" height="44" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="15.9" stroke="#D6E6F2" stroke-width="5" fill="none"/>
            <circle id="donut-arc" cx="18" cy="18" r="15.9" stroke="#5E86B8" stroke-width="5" fill="none"
                    transform="rotate(-90 18 18)"/>
          </svg>
          <div>
            <div id="hold-secs" class="font-display text-lg font-bold text-on-surface tabular">0.0s</div>
            <div class="font-display text-xs text-on-surface-variant">/ 3.0s</div>
          </div>
        </div>
        <div id="grip-status" class="font-display text-xs font-bold mt-2 text-on-surface-variant">집게 열림</div>
      </div>
      <!-- Chute pickups -->
      <div class="game-hud-verbose flex-1 rounded-xl overflow-hidden" style="background:rgba(255,255,255,0.4);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);min-height:80px;">
        <div class="font-display text-xs font-bold text-on-surface-variant p-2 pb-0">획득함</div>
        <div id="chute-items" class="p-2 flex flex-wrap gap-1"></div>
      </div>
      <!-- Instructions -->
      <div class="game-hud-verbose rounded-lg p-4 text-sm" style="background:rgba(255,255,255,0.4);border:1px dashed rgba(42,74,111,0.35);">
        <strong class="text-primary block mb-1 font-display text-xs">훈련 방법</strong>
        <span id="howto-text">① 꽉 쥐어 하강 ② 3초 파지 ③ 유지하며 운반 ④ 배출구에서 천천히 놓기</span>
      </div>
    </aside>

    <!-- Center Viewport -->
    <div id="game-viewport" class="game-stage flex-1">

      <!-- Phase chip -->
      <div id="phase-chip" aria-live="polite">캡슐 위에서 꽉 쥐세요</div>

      <!-- Crane Assembly -->
      <div id="crane-assembly">
        <!-- Rail -->
        <div style="height:6px;background:#64748B;border-bottom:2px solid #0F172A;width:100vw;position:absolute;top:0;left:-50vw;"></div>
        <!-- Trolley -->
        <div id="trolley"></div>
        <!-- Stretchable cable -->
        <div id="crane-cable"></div>
        <!-- Claw unit (descends) -->
        <div id="claw-unit">
          <svg id="crane-svg" width="100" height="160" viewBox="0 0 100 160" fill="none" style="display:block;">
            <!-- Body -->
            <rect x="30" y="85" width="40" height="28" rx="5" fill="#994626" stroke="#0F172A" stroke-width="3"/>
            <circle cx="50" cy="99" r="8" fill="white" stroke="#0F172A" stroke-width="2"/>
            <!-- Prongs container -->
            <g id="claw-group">
              <line id="prong-left"  x1="42" y1="112" x2="28" y2="148" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
              <line id="prong-right" x1="58" y1="112" x2="72" y2="148" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
            </g>
          </svg>
          <!-- Carried capsule -->
          <div id="carried-capsule"></div>
          <!-- Hold donut (overlay, follows the claw) -->
          <div id="hold-donut-wrap" class="absolute opacity-0 transition-opacity duration-200"
               style="top:96px;left:50%;transform:translateX(-50%);">
            <div id="donut-ring" class="relative w-16 h-16 flex items-center justify-center"
                 style="background:rgba(255,255,255,0.75);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,0.7);border-radius:50%;">
              <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 36 36">
                <circle cx="18" cy="18" r="14" stroke="#D6E6F2" stroke-width="4" fill="none"/>
                <circle id="donut-arc-claw" cx="18" cy="18" r="14" stroke="#5E86B8" stroke-width="4" fill="none"
                        stroke-dasharray="88" stroke-dashoffset="88" stroke-linecap="round"
                        style="transition:stroke-dashoffset 0.1s linear;"/>
              </svg>
              <span id="donut-text" class="font-display font-bold text-sm text-on-surface z-10">3s</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Chute (배출구) -->
      <div id="chute-zone">
        <div class="chute-wall"></div>
        <div class="chute-top"></div>
        <div class="chute-hole"></div>
        <div class="chute-label">DROP</div>
      </div>

      <!-- Floor / Capsule Area -->
      <div id="floor-area" class="absolute bottom-0 left-0 right-0" style="height:35%;border-top:4px solid #0F172A;">
        <!-- Capsules injected here by JS -->
        <div id="capsule-container" class="absolute inset-0"></div>
        <!-- "Insert Coin" flavor text -->
        <div class="absolute bottom-3 right-6 font-display font-bold text-xl tracking-widest uppercase opacity-20 pointer-events-none text-on-surface">
          INSERT COIN
        </div>
      </div>

    </div>

    <!-- Right Gauge -->
    <aside class="game-hud-right w-28 p-4 flex flex-col items-center flex-shrink-0" style="background:rgba(255,255,255,0.4);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-left:1px solid rgba(255,255,255,0.65);">
      <div class="font-display text-xs font-bold text-on-surface-variant mb-3 text-center">악력</div>
      <div class="game-hud-verbose font-display text-sm text-on-surface-variant mb-1">100%</div>
      <div id="gauge-track" role="meter" aria-label="악력 게이지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
           class="flex-1 w-10 relative rounded-full overflow-hidden" style="background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.65);">
        <!-- Scale ticks -->
        <div class="gauge-tick" style="bottom:25%;"></div>
        <div class="gauge-tick" style="bottom:50%;"></div>
        <div class="gauge-tick" style="bottom:75%;"></div>
        <!-- Target line (position/label set per phase by JS) -->
        <div id="target-line" style="bottom:80%;"></div>
        <div id="target-line-label" class="absolute font-display text-xs font-bold text-primary" style="right:100%;margin-right:4px;white-space:nowrap;bottom:80%;">80%↑</div>
        <div id="gauge-fill" class="absolute bottom-0 left-0 right-0 rounded-full" style="height:0%;background:var(--primary);"></div>
      </div>
      <div class="game-hud-verbose mt-2 mb-1 font-display text-sm text-on-surface-variant">0%</div>
      <div id="force-pct" class="font-display text-2xl font-bold text-primary mt-2 tabular">0%</div>
      <span id="force-live" class="sr-only" aria-live="polite"></span>
    </aside>

  </div>
</div>


<!-- ══ RESULT OVERLAY ═══════════════════════════════════════════════════ -->
<div id="result-overlay" class="fixed inset-0 z-50 items-center justify-center p-6" style="background:rgba(18,38,58,0.55);">
  <div class="result-card w-full max-w-md overflow-hidden" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 8px 32px rgba(42,74,111,0.2);border-radius:28px;">
    <div class="p-8 flex flex-col items-center gap-3 text-center" style="background:#B9D7EA;">
      <div class="w-16 h-16 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.7);box-shadow:0 4px 16px rgba(42,74,111,0.12);">
        <span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings:'FILL' 1">emoji_events</span>
      </div>
      <h2 class="font-display text-3xl font-bold tracking-tight text-ink-black">게임 완료</h2>
      <div id="result-stars" class="flex gap-1"></div>
    </div>
    <div class="p-6 grid grid-cols-2 gap-3">
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">획득 캡슐</div>
        <div id="res-score" class="font-display text-3xl font-bold text-primary tabular">0</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">최대 악력</div>
        <div id="res-max" class="font-display text-3xl font-bold text-primary tabular">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">평균 악력</div>
        <div id="res-avg" class="font-display text-3xl font-bold text-primary tabular">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">시도 횟수</div>
        <div id="res-attempts" class="font-display text-3xl font-bold text-primary tabular">0</div>
      </div>
    </div>
    <!-- Actions (shell renders buttons here) -->
    <div id="result-actions" class="px-6 pb-6 flex gap-3"></div>

    <!-- Reward confirmation (shell fills xp/levelup/achievements) -->
    <div id="reward-view" class="px-6 pb-6 pt-2 flex-col items-center gap-4 text-center" style="display:none;">
      <div class="font-display text-xs font-bold" style="color:var(--success-text);">서버에 저장 완료</div>
      <div class="flex items-baseline justify-center gap-1">
        <span class="font-display text-4xl font-bold text-primary tabular">+</span>
        <span id="reward-xp" class="font-display text-4xl font-bold text-primary tabular">0</span>
        <span class="font-display text-xl font-bold text-primary">XP</span>
      </div>
      <div id="reward-levelup" class="font-display text-lg font-bold px-4 py-1 rounded-full" style="display:none;background:#FEF9C3;color:#CA8A04;border:1px solid rgba(255,255,255,0.65);">Lv. — 달성!</div>
      <div id="reward-achievements" class="flex flex-wrap gap-2 justify-center"></div>
      <a href="history.html" class="w-full font-display font-bold py-3 rounded-full text-white flex items-center justify-center gap-2" style="background:linear-gradient(135deg, var(--blue-500), var(--blue-600));box-shadow:0 10px 26px rgba(94,134,184,0.42), inset 0 1px 0 rgba(255,255,255,0.35);">
        <span class="material-symbols-outlined text-base">timeline</span> 기록 보기
      </a>
    </div>
  </div>
</div>


<script src="shared.js"></script>
<script>
// ── Constants (game constants; force targets come from shell.cfg) ─────────────
const GAME_DURATION  = 60;    // seconds
const HOLD_NEEDED    = 3.0;   // seconds to secure a grip
const CRANE_SPEED    = 180;   // px/second (IDLE roam)
const DESCEND_SPEED  = 320;   // px/second (cable extend/retract)
const CARRY_SPEED    = 260;   // px/second (horizontal carry toward chute)
const REST_TIP_Y     = 142;   // prong-tip viewport y when clawY = 0
const CAPSULE_COLORS = ['#F472B6','#10B981','#FBBF24','#60A5FA','#A78BFA'];

// ── Reduced motion (kept locally for juice gating) ────────────────────────────
let reducedMotion = prefersReducedMotion();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const upd = () => { reducedMotion = prefersReducedMotion(); };
  if (mq.addEventListener) mq.addEventListener('change', upd);
  else if (mq.addListener) mq.addListener(upd);
}

// ── DOM refs ─────────────────────────────────────────────────────────────────
const craneAssembly  = document.getElementById('crane-assembly');
const craneCable     = document.getElementById('crane-cable');
const clawUnit       = document.getElementById('claw-unit');
const clawGroup      = document.getElementById('claw-group');
const carriedEl      = document.getElementById('carried-capsule');
const holdDonutWrap  = document.getElementById('hold-donut-wrap');
const donutRing      = document.getElementById('donut-ring');
const donutArcClaw   = document.getElementById('donut-arc-claw');
const donutText      = document.getElementById('donut-text');
const donutArcLeft   = document.getElementById('donut-arc');   // sidebar arc
const holdSecsEl     = document.getElementById('hold-secs');
const gripStatusEl   = document.getElementById('grip-status');
const gaugeFill      = document.getElementById('gauge-fill');
const gaugeTrack     = document.getElementById('gauge-track');
const forcePctEl     = document.getElementById('force-pct');
const forceLive      = document.getElementById('force-live');
const timerEl        = document.getElementById('timer-display');
const scoreEl        = document.getElementById('score-display');
const targetLine     = document.getElementById('target-line');
const targetLineLabel = document.getElementById('target-line-label');
const capsuleContainer = document.getElementById('capsule-container');
const chuteItems     = document.getElementById('chute-items');
const phaseChip      = document.getElementById('phase-chip');
const viewport       = document.getElementById('game-viewport');

// ── Shell ────────────────────────────────────────────────────────────────────
const shell = GameShell.create({
  gameId: 'crane',
  viewportId: 'game-viewport',
  howto: [
    { icon: 'fitness_center', text: '캡슐 위에서 꽉 쥐면 크레인이 내려갑니다' },
    { icon: 'south',          text: '바닥에서 3초간 꽉 쥐어 캡슐을 파지하세요' },
    { icon: 'trending_flat',  text: '힘을 유지한 채 배출구로 운반하세요' },
    { icon: 'back_hand',      text: '배출구 위에서 천천히 힘을 풀어 놓으세요' },
  ],
  onStart,
  onPauseChange,
  buildResult,
  onCleanup,
});
const cfg = shell.cfg;   // grabForce / descendMinForce / carryMinForce / releaseForce / graceMs

// Header 종료 → shell-owned exit confirmation
document.getElementById('exit-btn').addEventListener('click', () => shell.confirmExit());

// Instruction line uses the live carry threshold
document.getElementById('howto-text').textContent =
  `① 꽉 쥐어 하강 ② 3초 파지 ③ ${cfg.carryMinForce}% 유지하며 운반 ④ 배출구에서 천천히 놓기`;

// ── State ────────────────────────────────────────────────────────────────────
let phase        = 'IDLE';
let gripForce    = 0;
let pressActive  = false;
let craneX       = 250;
let craneDir     = 1;
let clawY        = 0;
let descendDepth = 300;
let minX = 150, maxX = 600, chuteX = 68;
let holdTime     = 0;
let graceTimer   = 0;      // ms of continuous low-force
let dropTimer    = 0;      // DROP transient timer
let carriedColor = null;
let targetCapsule = null;
let cycleGripForces = [];  // grip-force samples for the active capsule
let dropzoneStart = 0;

let score        = 0;
let attempts     = 0;      // DESCEND entries
let capsules     = [];
let forceSamples = [];
let maxForce     = 0;
let setDetails   = [];
let ariaAccum    = 0;
let lastShownSec = 60;
let donutBusy    = false;

let sessionStart = Date.now();
let gameElapsed  = 0;
let timeLeft     = GAME_DURATION;
let lastTick     = Date.now();
let rafId        = null;
let finished     = false;

let _finalResult = null;

// ── Layout (bounds + depth; recomputed on resize) ─────────────────────────────
function layout() {
  const vpW = viewport.clientWidth;
  const vpH = viewport.clientHeight;
  minX   = 150;
  maxX   = Math.max(minX + 120, vpW - 60);
  chuteX = 68;
  descendDepth = Math.max(90, vpH * 0.65 + 30 - REST_TIP_Y);
  craneX = Math.min(Math.max(craneX, minX), maxX);
}
window.addEventListener('resize', layout);
layout();

// ── Capsules ─────────────────────────────────────────────────────────────────
function spawnCapsules() {
  capsuleContainer.innerHTML = '';
  capsules = [];
  const vpW = viewport.clientWidth;
  const startX = Math.max(170, minX + 20);
  const endX   = Math.max(startX + 60, vpW - 60);
  const span   = endX - startX;
  const count  = 3 + Math.floor(Math.random() * 2);
  for (let i = 0; i < count; i++) {
    const cx = startX + span * ((i + 0.5) / count);
    const color = CAPSULE_COLORS[i % CAPSULE_COLORS.length];
    const el = document.createElement('div');
    el.className = 'capsule';
    el.style.left = (cx - 27) + 'px';
    el.style.bottom = '14px';
    el.style.background = color;
    capsuleContainer.appendChild(el);
    capsules.push({ el, x: cx, color, grabbed: false });
  }
}
spawnCapsules();

function capsuleUnder() {
  let best = null, bestDist = 999;
  for (const c of capsules) {
    if (c.grabbed) continue;
    const d = Math.abs(craneX - c.x);
    if (d < bestDist) { bestDist = d; best = c; }
  }
  return bestDist < 55 ? best : null;
}

function removeFloorCapsule(cap) {
  cap.grabbed = true;
  if (cap.el) cap.el.remove();
  capsules = capsules.filter(c => c !== cap);
}

// Drop a carried capsule back to the floor (re-grabbable). Juice under !reduced.
function dropCapsuleToFloor(x, color) {
  x = Math.min(Math.max(x, Math.max(170, minX + 20)), viewport.clientWidth - 60);
  const el = document.createElement('div');
  el.className = 'capsule';
  el.style.left = (x - 27) + 'px';
  el.style.bottom = '14px';
  el.style.background = color;
  capsuleContainer.appendChild(el);
  capsules.push({ el, x, color, grabbed: false });

  if (!reducedMotion) {
    el.style.opacity = '0';
    const fly = document.createElement('div');
    fly.className = 'fly-capsule';
    fly.style.width = '48px'; fly.style.height = '62px';
    fly.style.left = craneX + 'px';
    fly.style.top  = (REST_TIP_Y + clawY + 20) + 'px';
    fly.style.background = color;
    viewport.appendChild(fly);
    const floorY = viewport.clientHeight - 50;
    if (fly.animate) {
      const a = fly.animate([
        { transform: 'translate(-50%,-50%)' },
        { transform: `translate(calc(-50% + ${x - craneX}px), calc(-50% + ${floorY - (REST_TIP_Y + clawY + 20)}px))` },
      ], { duration: 520, easing: 'cubic-bezier(0.5,0,0.9,0.4)' });
      a.onfinish = () => { fly.remove(); el.style.opacity = '1'; };
    } else { fly.remove(); el.style.opacity = '1'; }
  }
}

// Animate a capsule into the chute opening (juice only; 획득함 add is separate).
function dropIntoChute(color) {
  if (reducedMotion) return;
  const fly = document.createElement('div');
  fly.className = 'fly-capsule';
  fly.style.left = craneX + 'px';
  fly.style.top  = (REST_TIP_Y + clawY + 20) + 'px';
  fly.style.background = color;
  viewport.appendChild(fly);
  const targetY = viewport.clientHeight * (1 - 0.44) + 20;
  if (fly.animate) {
    const a = fly.animate([
      { transform: 'translate(-50%,-50%)', opacity: 1 },
      { transform: `translate(calc(-50% + ${chuteX - craneX}px), calc(-50% + ${targetY - (REST_TIP_Y + clawY + 20)}px)) scale(0.45)`, opacity: 0.15 },
    ], { duration: 440, easing: 'cubic-bezier(0.55,0,0.9,0.2)' });
    a.onfinish = () => fly.remove();
  } else { setTimeout(() => fly.remove(), 440); }
}

function addChuteItem(color) {
  const chItem = document.createElement('div');
  chItem.className = 'chute-capsule';
  chItem.style.background = color;
  chuteItems.appendChild(chItem);
}

// ── Carried capsule + claw visuals ────────────────────────────────────────────
function showCarried(color) { carriedEl.style.background = color; carriedEl.style.display = 'block'; }
function hideCarried()      { carriedEl.style.display = 'none'; }

function craneOpen(open) {
  clawGroup.classList.toggle('claw-open', open);
  clawGroup.classList.toggle('claw-closed', !open);
}

// ── Floating +1 (reduced-motion no-op) ────────────────────────────────────────
function floatPlusOne(cx, cy) {
  if (reducedMotion) return;
  const el = document.createElement('div');
  el.className = 'plus-one';
  el.textContent = '+1';
  el.style.left = cx + 'px';
  el.style.top  = cy + 'px';
  viewport.appendChild(el);
  if (el.animate) {
    const a = el.animate(
      [{ transform: 'translate(-50%,-50%) translateY(0)', opacity: 1 },
       { transform: 'translate(-50%,-50%) translateY(-46px)', opacity: 0 }],
      { duration: 600, easing: 'cubic-bezier(0.22,1,0.36,1)' });
    a.onfinish = () => el.remove();
  } else { setTimeout(() => el.remove(), 600); }
}

// ── Gauge target line (per-phase; 'above' = 유지, 'below' = 낮추기) ────────────
let targetPct = cfg.grabForce, targetMode = 'above';
function setTarget(pct, mode) {
  if (pct === targetPct && mode === targetMode) return;
  targetPct = pct; targetMode = mode;
  const arrow = mode === 'below' ? '↓' : '↑';
  targetLine.style.bottom = pct + '%';
  targetLineLabel.style.bottom = pct + '%';
  targetLineLabel.textContent = pct + '%' + arrow;
  const col = mode === 'below' ? '#CA8A04' : '#5E86B8';
  targetLine.style.background = col;
  targetLineLabel.style.color = col;
}

// ── Phase chip ────────────────────────────────────────────────────────────────
function setPhaseChip(key) {
  let txt = '', cls = '';
  switch (key) {
    case 'IDLE':     txt = `캡슐 위에서 꽉 쥐세요 (${cfg.grabForce}% 이상)`; break;
    case 'DESCEND':  txt = '유지하며 내려갑니다…'; break;
    case 'GRIP':     txt = '꽉! 3초 파지'; break;
    case 'ASCEND':   txt = '끌어올리는 중…'; break;
    case 'CARRY':    txt = `배출구로 운반 중 — ${cfg.carryMinForce}% 이상 유지`; break;
    case 'DROPZONE': txt = `천천히 놓아주세요 (${cfg.releaseForce}% 미만)`; break;
    case 'DROP':     txt = '배출 성공!'; cls = 'chip-drop'; break;
    case 'FAIL':     txt = '놓쳤어요! 다시 시도'; cls = 'chip-fail'; break;
  }
  phaseChip.classList.remove('chip-fail', 'chip-drop');
  if (cls) phaseChip.classList.add(cls);
  if (phaseChip.textContent !== txt) phaseChip.textContent = txt;
}

// ── Hold donut ────────────────────────────────────────────────────────────────
function updateDonut() {
  const progress = Math.min(holdTime / HOLD_NEEDED, 1);
  holdDonutWrap.style.opacity = '1';
  donutArcClaw.style.stroke = '#16A34A';
  donutArcLeft.style.stroke = '#16A34A';
  donutArcClaw.style.strokeDashoffset = 88 * (1 - progress);
  donutArcLeft.style.strokeDashoffset = 100 * (1 - progress);
  donutText.textContent = Math.max(0, Math.ceil(HOLD_NEEDED - holdTime)) + 's';
  holdSecsEl.textContent = holdTime.toFixed(1) + 's';
  gripStatusEl.textContent = '집게 닫힘 — 유지!';
  gripStatusEl.style.color = '#2A4A6F';
}
function resetGripHud() {
  if (!donutBusy) holdDonutWrap.style.opacity = '0';
  donutArcClaw.style.stroke = '#5E86B8';
  donutArcLeft.style.stroke = '#5E86B8';
  donutArcClaw.style.strokeDashoffset = 88;
  donutArcLeft.style.strokeDashoffset = 100;
  donutText.textContent = '3s';
  holdSecsEl.textContent = '0.0s';
  gripStatusEl.textContent = '집게 열림';
  gripStatusEl.style.color = '#64748B';
}

// Early-release donut shake feedback (when a grip in progress is lost).
function donutMissFeedback() {
  if (reducedMotion || donutBusy) return;
  donutBusy = true;
  holdDonutWrap.style.opacity = '1';
  holdDonutWrap.classList.add('donut-shake');
  donutRing.classList.add('donut-flash');
  setTimeout(() => {
    holdDonutWrap.classList.remove('donut-shake');
    donutRing.classList.remove('donut-flash');
    holdDonutWrap.style.opacity = '0';
    donutBusy = false;
  }, 220);
}

// ── Failure transitions ───────────────────────────────────────────────────────
function failEmpty() {
  const hadProgress = holdTime > 0.3;
  graceTimer = 0; holdTime = 0;
  resetGripHud();
  if (hadProgress) donutMissFeedback();
  setPhaseChip('FAIL');
  if (!reducedMotion) { clawUnit.classList.remove('claw-miss'); void clawUnit.offsetWidth; clawUnit.classList.add('claw-miss'); }
  phase = 'ASCEND_EMPTY';
}
function failDropCapsule() {
  graceTimer = 0;
  const color = carriedColor; carriedColor = null;
  hideCarried();
  if (color) dropCapsuleToFloor(craneX, color);
  setPhaseChip('FAIL');
  phase = 'ASCEND_EMPTY';
}

// Grace helper: onFail after graceMs of continuous "bad" force.
function checkGrace(bad, dt, onFail) {
  if (bad) { graceTimer += dt * 1000; if (graceTimer >= cfg.graceMs) onFail(); }
  else graceTimer = 0;
}

// ── Success drop ──────────────────────────────────────────────────────────────
function commitCapsule(releaseSecs) {
  score++;
  scoreEl.textContent = score;
  const color = carriedColor; carriedColor = null;
  hideCarried();
  addChuteItem(color);
  dropIntoChute(color);
  const gripAvg = cycleGripForces.length
    ? Math.round(cycleGripForces.reduce((a, b) => a + b, 0) / cycleGripForces.length)
    : cfg.grabForce;
  setDetails.push({ setNum: score, force: gripAvg, holdSecs: HOLD_NEEDED, releaseSecs: releaseSecs });
  if (!reducedMotion && scoreEl.animate) scoreEl.animate(
    [{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }],
    { duration: 320, easing: 'cubic-bezier(0.34,1.56,0.64,1)' });
  floatPlusOne(chuteX, viewport.clientHeight * (1 - 0.44) + 20);
}

// ── Crane render (transform-only) ─────────────────────────────────────────────
function renderCrane() {
  craneAssembly.style.transform = 'translateX(' + (craneX - 50) + 'px)';
  clawUnit.style.transform = 'translateY(' + clawY + 'px)';
  craneCable.style.height = (63 + clawY) + 'px';
}
renderCrane();

// ── Game loop ─────────────────────────────────────────────────────────────────
function gameTick() {
  if (finished || !shell.playing) { rafId = null; return; }

  const now = Date.now();
  const dt = Math.min(0.05, (now - lastTick) / 1000);
  lastTick = now;

  // Force input (simulation ramps; real sensor drives gripForce via onForce)
  if (SensorService.getMode() === 'simulation') {
    gripForce = pressActive ? Math.min(100, gripForce + 55 * dt)
                            : Math.max(0, gripForce - 45 * dt);
    SensorService.setSimulatedForce(gripForce);
  }
  forceSamples.push(gripForce);
  if (gripForce > maxForce) maxForce = gripForce;

  // Timer
  gameElapsed += dt;
  timeLeft = Math.max(0, GAME_DURATION - gameElapsed);
  updateTimer();

  // ── State machine ──
  switch (phase) {
    case 'IDLE': {
      craneOpen(true);
      setPhaseChip('IDLE');
      setTarget(cfg.grabForce, 'above');
      clawY = 0;
      craneX += craneDir * CRANE_SPEED * dt;
      if (craneX > maxX) { craneX = maxX; craneDir = -1; }
      if (craneX < minX) { craneX = minX; craneDir = 1; }
      const cap = capsuleUnder();
      if (cap && gripForce >= cfg.grabForce) {
        targetCapsule = cap;
        craneX = cap.x;
        attempts++;
        graceTimer = 0;
        cycleGripForces = [];
        phase = 'DESCEND';
      }
      break;
    }
    case 'DESCEND': {
      craneOpen(true);
      setPhaseChip('DESCEND');
      setTarget(cfg.grabForce, 'above');
      craneX = targetCapsule ? targetCapsule.x : craneX;
      clawY += DESCEND_SPEED * dt;
      if (clawY >= descendDepth) { clawY = descendDepth; holdTime = 0; phase = 'GRIP'; }
      checkGrace(gripForce < cfg.descendMinForce, dt, failEmpty);
      break;
    }
    case 'GRIP': {
      craneOpen(false);
      setPhaseChip('GRIP');
      setTarget(cfg.grabForce, 'above');
      clawY = descendDepth;
      holdTime += dt;
      cycleGripForces.push(gripForce);
      updateDonut();
      if (holdTime >= HOLD_NEEDED) {
        carriedColor = targetCapsule ? targetCapsule.color : CAPSULE_COLORS[0];
        if (targetCapsule) removeFloorCapsule(targetCapsule);
        showCarried(carriedColor);
        resetGripHud();
        graceTimer = 0;
        phase = 'ASCEND_FULL';
      } else {
        checkGrace(gripForce < cfg.descendMinForce, dt, failEmpty);
      }
      break;
    }
    case 'ASCEND_FULL': {
      craneOpen(false);
      setPhaseChip('ASCEND');
      setTarget(cfg.carryMinForce, 'above');
      clawY -= DESCEND_SPEED * dt;
      if (clawY <= 0) { clawY = 0; phase = 'CARRY'; }
      checkGrace(gripForce < cfg.carryMinForce, dt, failDropCapsule);
      break;
    }
    case 'CARRY': {
      craneOpen(false);
      setPhaseChip('CARRY');
      setTarget(cfg.carryMinForce, 'above');
      clawY = 0;
      craneX = moveToward(craneX, chuteX, CARRY_SPEED * dt);
      if (Math.abs(craneX - chuteX) < 2) { craneX = chuteX; dropzoneStart = Date.now(); phase = 'DROPZONE'; }
      checkGrace(gripForce < cfg.carryMinForce, dt, failDropCapsule);
      break;
    }
    case 'DROPZONE': {
      craneOpen(false);
      setPhaseChip('DROPZONE');
      setTarget(cfg.releaseForce, 'below');
      craneX = chuteX; clawY = 0;
      // Success: relax below releaseForce → capsule drops into the chute.
      if (gripForce < cfg.releaseForce) {
        const releaseSecs = +((Date.now() - dropzoneStart) / 1000).toFixed(1);
        craneOpen(true);
        commitCapsule(releaseSecs);
        dropTimer = 0;
        phase = 'DROP';
      }
      // No carry-fail here: lowering the force IS the goal (release control).
      break;
    }
    case 'DROP': {
      craneOpen(true);
      setPhaseChip('DROP');
      dropTimer += dt;
      if (dropTimer >= 0.5) {
        dropTimer = 0;
        if (capsules.length === 0) spawnCapsules();
        phase = 'IDLE';
      }
      break;
    }
    case 'ASCEND_EMPTY': {
      craneOpen(true);
      clawY -= DESCEND_SPEED * dt;
      if (clawY <= 0) { clawY = 0; graceTimer = 0; phase = 'IDLE'; }
      break;
    }
  }

  renderCrane();

  // Gauge fill + meeting state
  const meeting = targetMode === 'below' ? (gripForce < targetPct) : (gripForce >= targetPct);
  gaugeFill.style.height = gripForce + '%';
  gaugeFill.style.background = meeting ? '#16A34A' : '#5E86B8';
  gaugeTrack.classList.toggle('gauge-hot', meeting);
  forcePctEl.textContent = Math.round(gripForce) + '%';

  // A11y — meter value + throttled (1s) live mirror
  ariaAccum += dt;
  if (ariaAccum >= 1) {
    ariaAccum = 0;
    const fv = Math.round(gripForce);
    gaugeTrack.setAttribute('aria-valuenow', fv);
    if (forceLive) forceLive.textContent = '악력 ' + fv + '퍼센트';
  }

  if (timeLeft <= 0) { handleTimeUp(); return; }

  rafId = requestAnimationFrame(gameTick);
}

function moveToward(cur, target, step) {
  return cur < target ? Math.min(cur + step, target) : Math.max(cur - step, target);
}

function updateTimer() {
  const t = Math.ceil(timeLeft);
  if (t === lastShownSec) return;
  lastShownSec = t;
  const m = Math.floor(t / 60);
  const s = t % 60;
  timerEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
  if (t <= 10) timerEl.classList.add('timer-warning');
}

// ── Time-up handling (auto-success while carrying) ────────────────────────────
function handleTimeUp() {
  if (finished) return;
  if ((phase === 'ASCEND_FULL' || phase === 'CARRY' || phase === 'DROPZONE') && carriedColor) {
    const releaseSecs = phase === 'DROPZONE' ? +((Date.now() - dropzoneStart) / 1000).toFixed(1) : 0;
    commitCapsule(releaseSecs);
  }
  finishGame();
}

// ── Finish → fill stats, then hand to shell ───────────────────────────────────
function finishGame() {
  if (finished) return;
  finished = true;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }

  const avgF = forceSamples.length
    ? Math.round(forceSamples.reduce((a, b) => a + b, 0) / forceSamples.length) : 0;
  // 서버 제약: avgForce ≤ maxForce ≤ 100.
  const maxF = Math.min(100, Math.max(Math.round(maxForce), avgF));
  const stars = starsForScore('crane', score);
  const elapsedSec = Math.round((Date.now() - sessionStart) / 1000);
  const durationMin = Math.max(1, Math.round(elapsedSec / 60));

  _finalResult = {
    date:        new Date().toISOString(),
    gameId:      'crane',
    label:       GAME_DEFS.crane.label,
    durationMin,
    durationSec: elapsedSec,
    sets:        score,      // 크레인 = 캡슐 수
    attempts,                // DESCEND 진입 횟수
    avgForce:    avgF,
    maxForce:    maxF,
    stars,
    setDetails,
  };

  // Game fills its own stats before shell.end() opens/renders the overlay.
  animateCount(document.getElementById('res-score'),    score,    { duration: 700 });
  animateCount(document.getElementById('res-max'),      maxF,     { suffix: '%', duration: 700 });
  animateCount(document.getElementById('res-avg'),      avgF,     { suffix: '%', duration: 700 });
  animateCount(document.getElementById('res-attempts'), attempts, { duration: 700 });

  shell.end();   // buildResult → auto-save → overlay + stars + buttons + reward
}

// ── Shell callbacks ───────────────────────────────────────────────────────────
function onStart() {
  sessionStart = Date.now();
  gameElapsed = 0;
  timeLeft = GAME_DURATION;
  lastTick = Date.now();
  rafId = requestAnimationFrame(gameTick);
}

function onPauseChange(paused) {
  if (paused) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  } else {
    lastTick = Date.now();   // avoid a dt spike on resume
    if (rafId === null && !finished) rafId = requestAnimationFrame(gameTick);
  }
}

function buildResult() { return _finalResult || {}; }

function onCleanup() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  SensorService.offForceUpdate(onForce);
  document.removeEventListener('visibilitychange', onVis);
}

// ── Force input (shell-guarded press + sensor stream) ─────────────────────────
shell.bindPress(() => { pressActive = true; }, () => { pressActive = false; });
const onForce = f => { gripForce = f; };
SensorService.onForceUpdate(onForce);

// ── Visibility gating (rAF only; respects shell pause) ────────────────────────
function onVis() {
  if (document.hidden) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  } else if (shell.playing && rafId === null && !finished) {
    lastTick = Date.now();
    rafId = requestAnimationFrame(gameTick);
  }
}
document.addEventListener('visibilitychange', onVis);

// Initial claw state
craneOpen(true);

// ── Test hook (harness only; no gameplay effect) ──────────────────────────────
window.__crane = {
  get phase()    { return phase; },
  get score()    { return score; },
  get attempts() { return attempts; },
  get timeLeft() { return timeLeft; },
  get force()    { return gripForce; },
  get capsules() { return capsules.length; },
  get playing()  { return shell.playing; },
  setTimeLeft(v) { gameElapsed = GAME_DURATION - v; },
  press()   { pressActive = true; },
  release() { pressActive = false; },
};
</script>
</body>
