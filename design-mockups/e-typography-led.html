<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReGrip 시안 E — 타이포 주도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
:root {
  --blue-50:#F7FBFC; --blue-100:#D6E6F2; --blue-200:#B9D7EA; --blue-500:#769FCD;
  --blue-300:#9FC3E0; --blue-400:#8BB1D7; --blue-600:#5E86B8; --blue-700:#2A4A6F;
  --navy-800:#1B314B; --navy-900:#112032; --navy-950:#091320;
  --ink:#12263A; --ink-secondary:#3F5A75; --ink-muted:#587693;
  --ink-inverse:#EAF3FA; --ink-inverse-muted:#8FB0CC;
  --success:#16A34A; --success-text:#15803D; --warning:#CA8A04; --error:#DC2626;
  --glass-bg:rgba(255,255,255,0.55); --glass-border:rgba(255,255,255,0.65);
  --glass-dark-bg:rgba(17,32,50,0.55); --glass-blur:20px;
  --dur-fast:150ms; --dur-base:220ms; --dur-slow:400ms;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --terracotta:#994626;
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--blue-50);
  color: var(--ink);
  font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  overflow-x: hidden;
}
h1, h2, h3, p, ul, li, figure { margin: 0; padding: 0; list-style: none; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
img { max-width: 100%; display: block; }

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 22;
  font-size: 20px;
  line-height: 1;
  user-select: none;
}

.num { font-variant-numeric: tabular-nums; }

/* ---------- focus ---------- */
a:focus-visible,
button:focus-visible,
input:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--blue-600);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------- views ---------- */
.view { display: none; }
.view.is-active { display: block; }

/* ================= LOGIN VIEW ================= */
.login-shell {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.login-card {
  width: 100%;
  max-width: 380px;
  background: rgba(255,255,255,0.75);
  border: 1px solid rgba(118,159,205,0.25);
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(18,38,58,0.04);
  padding: 36px 32px 32px;
}

.login-wordmark {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--ink);
  text-align: center;
}

.login-sub {
  margin-top: 6px;
  font-size: 13px;
  color: var(--ink-secondary);
  text-align: center;
}

.login-tabs {
  display: flex;
  margin-top: 28px;
  border-bottom: 1px solid rgba(118,159,205,0.25);
}

.login-tab {
  flex: 1;
  background: none;
  border: none;
  padding: 10px 4px 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}

.login-tab.is-active {
  color: var(--ink);
  border-bottom-color: var(--blue-600);
}

.login-tab:hover { color: var(--ink); }
.login-tab:active { color: var(--blue-700); }

.login-form {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-muted);
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--ink);
  background: #FFFFFF;
  border: 1px solid rgba(118,159,205,0.35);
  border-radius: 6px;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}

.field input::placeholder { color: var(--ink-muted); opacity: 0.75; }

.field input:hover { border-color: rgba(118,159,205,0.55); }

.field input:focus-visible {
  outline: none;
  border-color: var(--blue-600);
  box-shadow: 0 0 0 3px rgba(118,159,205,0.20);
}

.btn-primary {
  width: 100%;
  margin-top: 4px;
  padding: 11px 16px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: #FFFFFF;
  background: var(--blue-600);
  border: 1px solid var(--blue-600);
  border-radius: 6px;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}

.btn-primary:hover { background: var(--blue-700); border-color: var(--blue-700); }
.btn-primary:active { background: var(--navy-800); border-color: var(--navy-800); transform: translateY(1px); }

.login-footer {
  margin-top: 20px;
  text-align: center;
}

.login-footer .link-btn {
  background: none;
  border: none;
  padding: 4px 2px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-secondary);
  border-bottom: 1px solid rgba(118,159,205,0.45);
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}

.login-footer .link-btn:hover { color: var(--blue-700); border-color: var(--blue-700); }
.login-footer .link-btn:active { color: var(--navy-800); }

/* ================= HOME VIEW ================= */
.app-shell {
  min-height: 100vh;
}

/* ---- sidebar (desktop) ---- */
.sidebar {
  display: none;
}

.sidebar-wordmark {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--ink);
  padding: 4px 12px 4px;
}

.sidebar-nav {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border: none;
  background: transparent;
  border-radius: 6px;
  border-left: 2px solid transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-secondary);
  text-align: left;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}

.nav-item .material-symbols-outlined { font-size: 19px; color: var(--ink-muted); transition: color var(--dur-fast) var(--ease-out); }

.nav-item:hover { background: rgba(118,159,205,0.08); color: var(--ink); }

.nav-item.is-active {
  background: rgba(118,159,205,0.10);
  border-left-color: var(--blue-600);
  color: var(--ink);
}

.nav-item.is-active .material-symbols-outlined { color: var(--blue-700); }

.nav-item:active { background: rgba(118,159,205,0.16); }

/* ---- content ---- */
.content {
  padding: 28px 20px 96px;
  max-width: 720px;
  margin: 0 auto;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.greeting {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--ink);
}

.greeting-sub {
  margin-top: 4px;
  font-size: 13px;
  color: var(--ink-secondary);
}

.level-chip {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  padding: 7px 14px;
  background: rgba(118,159,205,0.10);
  border: 1px solid rgba(118,159,205,0.25);
  border-radius: 8px;
}

.level-chip .level-label {
  font-size: 11px;
  color: var(--ink-muted);
}

.level-chip .level-value {
  font-size: 13px;
  font-weight: 700;
  color: var(--blue-700);
}

/* ---- cards (shared) ---- */
.card {
  background: rgba(255,255,255,0.75);
  border: 1px solid rgba(118,159,205,0.25);
  border-radius: 10px;
  box-shadow: 0 1px 2px rgba(18,38,58,0.04);
}

.card-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-muted);
  letter-spacing: -0.01em;
}

/* ---- hero (today's training) ---- */
.hero {
  margin-top: 20px;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.hero-title {
  margin-top: 8px;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--ink);
}

.hero-meta {
  margin-top: 6px;
  font-size: 13px;
  color: var(--ink-muted);
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.btn-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 11px 20px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: #FFFFFF;
  background: var(--terracotta);
  border: 1px solid var(--terracotta);
  border-radius: 7px;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}

.btn-cta:hover { filter: brightness(0.90); }
.btn-cta:active { filter: brightness(0.78); transform: translateY(1px); }

.btn-ghost {
  padding: 11px 18px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-secondary);
  background: transparent;
  border: 1px solid rgba(118,159,205,0.40);
  border-radius: 7px;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}

.btn-ghost:hover { background: rgba(118,159,205,0.10); border-color: var(--blue-600); color: var(--ink); }
.btn-ghost:active { background: rgba(118,159,205,0.18); }

/* ---- stats grid ---- */
.stats-grid {
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.stat-card {
  padding: 14px 12px;
}

.stat-top {
  display: flex;
  align-items: center;
  gap: 6px;
}

.stat-top .material-symbols-outlined { font-size: 16px; }
.stat-top .material-symbols-outlined.is-terracotta { color: var(--terracotta); }
.stat-top .material-symbols-outlined.is-accent { color: var(--blue-700); }

.stat-value {
  margin-top: 8px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--ink);
}

.stat-delta {
  margin-left: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--success-text);
}

/* ---- weekly goal ---- */
.goal-card {
  margin-top: 10px;
  padding: 18px 20px;
}

.goal-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.goal-title { font-size: 13px; font-weight: 600; color: var(--ink); }
.goal-fraction { font-size: 13px; font-weight: 700; color: var(--ink); }

.progress-track {
  margin-top: 10px;
  height: 6px;
  border-radius: 999px;
  background: rgba(118,159,205,0.18);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--blue-600);
  width: 80%;
}

/* ---- recent sessions ---- */
.sessions-card {
  margin-top: 10px;
  padding: 4px 0;
}

.sessions-title {
  padding: 14px 20px 4px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.session-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  border-top: 1px solid rgba(118,159,205,0.18);
  transition: background var(--dur-fast) var(--ease-out);
}

.session-row:hover { background: rgba(214,230,242,0.3); }

.session-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}

.session-date {
  margin-top: 2px;
  font-size: 12px;
  color: var(--ink-muted);
}

.session-stars {
  font-size: 13px;
  color: var(--ink-muted);
  letter-spacing: 1px;
  flex-shrink: 0;
}

/* ---- bottom tab bar (mobile) ---- */
.bottom-tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  background: var(--blue-50);
  border-top: 1px solid rgba(118,159,205,0.25);
  z-index: 500;
}

.tab-item {
  flex: 1;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  border: none;
  background: transparent;
  color: var(--ink-muted);
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}

.tab-item .material-symbols-outlined { font-size: 21px; }

.tab-item .tab-label {
  font-size: 10px;
  font-weight: 600;
}

.tab-item:hover { background: rgba(118,159,205,0.08); }
.tab-item:active { background: rgba(118,159,205,0.16); }

.tab-item.is-active { color: var(--blue-700); }
.tab-item.is-active .material-symbols-outlined { color: var(--blue-700); }

/* ---- floating view toggle ---- */
.view-toggle {
  position: fixed;
  right: 16px;
  bottom: 76px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 14px 9px 12px;
  background: var(--blue-700);
  color: #FFFFFF;
  border: 1px solid var(--blue-700);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(18,38,58,0.22);
  transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}

.view-toggle .material-symbols-outlined { font-size: 17px; }

.view-toggle:hover { background: var(--navy-800); }
.view-toggle:active { background: var(--navy-900); transform: translateY(1px); }

/* ================= responsive ================= */
@media (min-width: 768px) {
  .app-shell { display: flex; }

  .sidebar {
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 220px;
    padding: 22px 12px;
    background: var(--blue-50);
    border-right: 1px solid rgba(118,159,205,0.25);
    overflow-y: auto;
  }

  .content {
    margin-left: 220px;
    padding: 40px 40px 60px;
    max-width: 760px;
  }

  .bottom-tabbar { display: none; }

  .view-toggle { bottom: 20px; }
}

@media (max-width: 767.98px) {
  .content { padding-bottom: 88px; }
}

@media (max-width: 400px) {
  .stat-value { font-size: 16px; }
  .stats-grid { gap: 8px; }
  .stat-card { padding: 12px 8px; }
}

/* ================= reduced motion ================= */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>
<body>

<!-- ================= LOGIN VIEW ================= -->
<div id="login" class="view">
  <div class="login-shell">
    <div class="login-card">
      <div class="login-wordmark">ReGrip</div>
      <p class="login-sub">계정에 로그인하세요</p>

      <div class="login-tabs" role="tablist" aria-label="로그인 및 회원가입">
        <button type="button" class="login-tab is-active" role="tab" aria-selected="true">로그인</button>
        <button type="button" class="login-tab" role="tab" aria-selected="false">회원가입</button>
      </div>

      <form class="login-form" onsubmit="return false;">
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">로그인</button>
      </form>

      <div class="login-footer">
        <button type="button" class="link-btn">서버 없이 로컬로 시작하기</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= HOME VIEW ================= -->
<div id="home" class="view">
  <div class="app-shell">

    <nav class="sidebar" aria-label="주요 메뉴">
      <div class="sidebar-wordmark">ReGrip</div>
      <div class="sidebar-nav">
        <button type="button" class="nav-item is-active" aria-current="page">
          <span class="material-symbols-outlined" aria-hidden="true">home</span>
          <span>홈</span>
        </button>
        <button type="button" class="nav-item">
          <span class="material-symbols-outlined" aria-hidden="true">fitness_center</span>
          <span>훈련</span>
        </button>
        <button type="button" class="nav-item">
          <span class="material-symbols-outlined" aria-hidden="true">history</span>
          <span>기록</span>
        </button>
        <button type="button" class="nav-item">
          <span class="material-symbols-outlined" aria-hidden="true">workspace_premium</span>
          <span>업적</span>
        </button>
        <button type="button" class="nav-item">
          <span class="material-symbols-outlined" aria-hidden="true">settings</span>
          <span>설정</span>
        </button>
      </div>
    </nav>

    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="greeting">안녕하세요, 지혜님! 👋</h1>
          <p class="greeting-sub">오늘도 목표를 향해 나아갈 준비가 되셨나요?</p>
        </div>
        <div class="level-chip">
          <span class="level-label">현재 레벨</span>
          <span class="level-value num">Lv.7 · 중급</span>
        </div>
      </div>

      <section class="card hero">
        <div>
          <span class="card-label">오늘의 훈련</span>
          <h2 class="hero-title">리듬 스퀴즈</h2>
          <p class="hero-meta num">3세트 · 약 8분</p>
        </div>
        <div class="hero-actions">
          <button type="button" class="btn-ghost">캘리브레이션</button>
          <button type="button" class="btn-cta">
            <span>훈련 시작하기</span>
            <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
          </button>
        </div>
      </section>

      <section class="stats-grid" aria-label="이번 주 요약 통계">
        <div class="card stat-card">
          <div class="stat-top">
            <span class="material-symbols-outlined is-terracotta" aria-hidden="true">local_fire_department</span>
            <span class="card-label">연속 출석</span>
          </div>
          <div class="stat-value num">12일</div>
        </div>
        <div class="card stat-card">
          <div class="stat-top">
            <span class="material-symbols-outlined is-accent" aria-hidden="true">monitoring</span>
            <span class="card-label">이번 주 악력</span>
          </div>
          <div class="stat-value num">24.5 kg<span class="stat-delta num">(+1.2)</span></div>
        </div>
        <div class="card stat-card">
          <div class="stat-top">
            <span class="material-symbols-outlined is-accent" aria-hidden="true">workspace_premium</span>
            <span class="card-label">획득 배지</span>
          </div>
          <div class="stat-value num">8개</div>
        </div>
      </section>

      <section class="card goal-card">
        <div class="goal-top">
          <span class="goal-title">이번 주 목표 달성률</span>
          <span class="goal-fraction num">4/5 세션</span>
        </div>
        <div class="progress-track" role="progressbar" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100" aria-label="이번 주 목표 달성률 80%">
          <div class="progress-fill"></div>
        </div>
      </section>

      <section class="card sessions-card" aria-label="최근 세션">
        <h3 class="sessions-title">최근 세션</h3>
        <div class="session-row">
          <div>
            <div class="session-name">리듬 스퀴즈</div>
            <div class="session-date num">7월 12일</div>
          </div>
          <div class="session-stars" aria-label="별점 3점">★★★</div>
        </div>

<!-- ================= floating view toggle ================= -->
<button type="button" id="viewToggle" class="view-toggle">
  <span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span>
  <span id="viewToggleLabel">로그인 화면</span>
</button>

<script>
(function () {
  var loginView = document.getElementById('login');
  var homeView = document.getElementById('home');
  var toggleBtn = document.getElementById('viewToggle');
  var toggleLabel = document.getElementById('viewToggleLabel');

  function applyHash() {
    var hash = window.location.hash.replace('#', '');
    var isLogin = hash === 'login';

    loginView.classList.toggle('is-active', isLogin);
    homeView.classList.toggle('is-active', !isLogin);
    toggleLabel.textContent = isLogin ? '홈 화면' : '로그인 화면';
  }

  toggleBtn.addEventListener('click', function () {
    var isLogin = window.location.hash.replace('#', '') === 'login';
    window.location.hash = isLogin ? 'home' : 'login';
  });

  window.addEventListener('hashchange', applyHash);
  applyHash();
})();
</script>
