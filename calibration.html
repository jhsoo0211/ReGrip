<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReGrip — 캘리브레이션 룸</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<link rel="stylesheet" href="sensor-ui.css"/>
<script src="tailwind-config.js"></script>
<style>
  /* ── Calibration step state machine (.step-active / .step-done / .step-locked) ── */
  .cal-step {
    border: 1px solid var(--glass-border);
    border-radius: 0.75rem;
    padding: 1.25rem;
    background: rgba(255,255,255,0.5);
    transition: background-color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out),
                opacity var(--dur-base) var(--ease-out);
  }
  .cal-step.step-active { background: rgba(255,255,255,0.65); box-shadow: var(--glass-shadow); }
  .cal-step.step-locked { background: var(--surface);   opacity: 0.5; pointer-events: none; }
  .cal-step.step-done   { background: #F0FFF8; }

  /* Step number marker — number-details grammar (01 / 02), morphs to check on done */
  .cal-step-num {
    width: 2.75rem; height: 2.75rem;
    border-radius: 9999px;
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.95rem; letter-spacing: 0.02em;
    background: var(--bg-app);
    flex-shrink: 0;
    transition: background-color var(--dur-base) var(--ease-out),
                color var(--dur-base) var(--ease-out);
  }
  .step-active .cal-step-num { background: var(--primary);  color: #fff; }
  .step-locked .cal-step-num { background: var(--surface);  color: var(--ink-muted); }
  .step-done   .cal-step-num { background: #10B981;         color: #fff; }
  .cal-step-num.check-pop { animation: checkPop 200ms var(--ease-out) 1; }
  @keyframes checkPop {
    0%   { transform: scale(0.6); }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ── Capture buttons (≥48px touch target) ── */
  .cal-capture-btn {
    min-height: 48px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 1.25rem;
    background: var(--ink-muted); color: #fff;
    font-weight: 700; font-size: 0.875rem;
    border: 1px solid var(--glass-border); border-radius: var(--border-radius);
    box-shadow: 0 4px 16px rgba(42,74,111,0.10);
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-out),
                box-shadow var(--dur-fast) var(--ease-out),
                filter var(--dur-fast) var(--ease-out);
  }
  .step-active .cal-capture-btn { background: var(--primary); }
  .cal-capture-btn:hover:not(:disabled)  { filter: brightness(1.04); }
  .cal-capture-btn:active:not(:disabled) { transform: scale(0.97); box-shadow: none; }
  .cal-capture-btn:disabled { cursor: default; box-shadow: none; }
  .cal-capture-btn.captured { background: #10B981; }

  /* ── Start button — locked → unlocked with pop + retro-shadow entrance ── */
  #btn-start {
    background: var(--surface-warm);
    color: var(--ink-muted);
    box-shadow: 0 4px 16px rgba(42,74,111,0.10);
    cursor: not-allowed;
    transition: background-color var(--dur-base) var(--ease-out),
                color var(--dur-base) var(--ease-out),
                box-shadow var(--dur-base) var(--ease-out);
  }
  #btn-start.unlocked {
    background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
    color: #fff;
    box-shadow: 0 10px 26px rgba(94,134,184,0.42), inset 0 1px 0 rgba(255,255,255,0.35);
    cursor: pointer;
  }
  #btn-start.unlocked.pop { animation: unlockPop 260ms var(--ease-out) 1; }
  @keyframes unlockPop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.04); }
    100% { transform: scale(1); }
  }

  /* ── Meter baseline dash markers + capture flash ── */
  .meter-baseline {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px dashed var(--ink);
    z-index: 3;
    pointer-events: none;
  }
  .meter-baseline .meter-baseline-label {
    position: absolute;
    left: calc(100% + 6px);
    top: -0.65em;
    white-space: nowrap;
    font-weight: 700; font-size: 0.65rem; letter-spacing: 0.02em;
    color: var(--ink);
  }
  .meter-flash {
    position: absolute; inset: 0;
    border-radius: 9999px;
    background: #10B981;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  .meter-flash.flash { animation: meterFlash 420ms ease-out 1; }
  @keyframes meterFlash {
    0%   { opacity: 0; }
    30%  { opacity: 0.55; }
    100% { opacity: 0; }
  }

  /* ── Existing-calibration info box ── */
  .cal-info-box {
    border: 1px solid var(--glass-border);
    background: var(--surface-warm);
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
  }
</style>
</head>
<body class="bg-background-sky text-on-surface min-h-screen flex flex-col items-center justify-center p-6">

  <!-- Header (wizard mode — no sidebar) -->
  <header class="w-full max-w-[900px] flex items-center mb-6">
    <button type="button" onclick="goBack('settings.html')"
       class="flex items-center gap-2 text-on-surface hover:text-primary transition-colors font-display font-bold text-sm bg-transparent border-0 cursor-pointer p-0">
      <span class="material-symbols-outlined">arrow_back</span>
      뒤로
    </button>
  </header>

  <!-- Main Card -->
  <main class="w-full max-w-[900px] bg-white rounded-2xl retro-shadow retro-border-thick overflow-hidden flex flex-col md:flex-row">

    <!-- Left: Steps -->
    <section class="flex-1 p-8 md:p-10 border-b md:border-b-0 md:border-r border-surface-container flex flex-col justify-between">
      <div>
        <h1 class="font-display text-4xl font-bold mb-1 tracking-tight">캘리브레이션 룸</h1>
        <p class="text-cool-gray text-base mb-6">압력 센서의 이완·편안한 쥐기 기준을 설정합니다.</p>

        <div id="calibration-sensor-controls" class="mb-6"></div>
        <!-- Existing calibration (populated on load if a record exists) -->
        <div id="existing-cal" class="cal-info-box mb-6 hidden">
          <div class="flex items-start gap-2">
            <span class="material-symbols-outlined text-primary text-xl flex-shrink-0" style="font-variation-settings:'FILL' 1">history</span>
            <div class="text-sm">
              <div id="existing-cal-detail" class="font-display font-bold text-on-surface">—</div>
              <div class="text-cool-gray mt-1">아래 단계를 다시 진행하면 새 기준으로 덮어씁니다.</div>
            </div>
          </div>
        </div>

        <div class="space-y-4">

          <!-- Step 1 -->
          <div id="step-1" class="cal-step step-active">
            <div class="flex items-start justify-between">
              <div class="flex gap-4">
                <div id="step-1-number" class="cal-step-num">01</div>
                <div>
                  <h3 class="font-display text-lg font-bold mb-1">0% 기준 (힘 빼기)</h3>
                  <p class="text-cool-gray text-sm">손에 힘을 완전히 빼세요.</p>
                </div>
              </div>
              <span class="material-symbols-outlined text-3xl text-cool-gray flex-shrink-0" style="font-variation-settings:'FILL' 0">front_hand</span>
            </div>
            <div class="mt-4 flex justify-end">
              <button id="btn-cap-1" onclick="captureBaseline(1)" class="cal-capture-btn">0% 기록</button>
            </div>
          </div>

          <!-- Step 2 -->
          <div id="step-2" class="cal-step step-locked">
            <div class="flex items-start justify-between">
              <div class="flex gap-4">
                <div id="step-2-number" class="cal-step-num">02</div>
                <div>
                  <h3 class="font-display text-lg font-bold mb-1">100% 기준 (편안하게 쥐기)</h3>
                  <p class="text-cool-gray text-sm">무리하지 말고 <span class="font-bold underline">편안하게</span> 쥔 상태를 유지하세요.</p>
                </div>
              </div>
              <span class="material-symbols-outlined text-3xl text-on-surface flex-shrink-0" style="font-variation-settings:'FILL' 1">back_hand</span>
            </div>
            <div class="mt-4 flex justify-end">
              <button id="btn-cap-2" onclick="captureBaseline(2)" class="cal-capture-btn">100% 기록</button>
            </div>
          </div>

        </div>
      </div>

      <p id="calibration-error" class="calibration-error" role="alert"></p>
      <button id="reset-calibration" type="button" class="cal-capture-btn">처음부터 다시 보정</button>
      <!-- Start Button -->
      <div class="mt-8">
        <button id="btn-start"
                disabled
                onclick="window.location.href='training.html'"
                class="w-full font-display font-bold text-xl py-4 rounded retro-border">
          운동 시작
        </button>
      </div>
    </section>

    <!-- Right: Live Meter -->
    <section id="meter-wrap" class="w-full md:w-[280px] bg-surface p-8 flex flex-col items-center justify-center select-none">
      <h3 class="font-display text-xs font-bold text-cool-gray mb-6 text-center">실시간 센서<br/>데이터</h3>

      <div id="tube-wrap" class="relative h-[360px] w-10 flex flex-col items-center">
        <!-- 100% label -->
        <div class="absolute -top-5 right-14 font-display font-bold text-on-surface text-sm">100%</div>
        <div class="absolute top-0 right-12 w-8 border-t-2 border-dashed border-cool-gray opacity-40"></div>

        <!-- Tube -->
        <div class="w-full h-full bg-background-sky rounded-full retro-border overflow-hidden relative shadow-inner">
          <div id="live-meter-fill"
               class="absolute bottom-0 left-0 right-0 transition-all duration-100 ease-out rounded-full"
               style="height:0%;background:var(--primary);"></div>
          <div id="meter-flash" class="meter-flash"></div>
        </div>

        <!-- 0% label -->
        <div class="absolute -bottom-5 right-14 font-display font-bold text-on-surface text-sm">0%</div>
        <div class="absolute bottom-0 right-12 w-8 border-t-2 border-dashed border-cool-gray opacity-40"></div>

        <!-- Captured baseline dash markers -->
        <div id="baseline-marker-0"   class="meter-baseline hidden"><span class="meter-baseline-label"></span></div>
        <div id="baseline-marker-100" class="meter-baseline hidden"><span class="meter-baseline-label"></span></div>
      </div>

      <p id="calibration-raw" class="text-xs mt-4"></p>
      <div id="live-value" class="mt-8 font-display text-3xl font-bold text-on-surface tabular" aria-live="polite" aria-atomic="true">0%</div>

      <p id="sim-hint" class="mt-2 text-[11px] font-display font-bold text-cool-gray text-center leading-snug">
        SPACE 또는 미터를 홀드해<br/>쥐는 힘을 조절하세요
      </p>

      <!-- Baseline indicators (text mirror of tube markers) -->
      <div id="baseline-info" class="mt-4 text-xs font-display font-bold text-cool-gray text-center space-y-1 hidden">
        <div id="b0-info">0% 기준: —</div>
        <div id="b100-info">100% 기준: —</div>
      </div>
    </section>

  </main>

<script src="sensor-service.js"></script>
<script src="sensor-ui.js"></script>
<script src="shared.js"></script>
  <script>
/* Raw capture wizard: simulation is never saved as sensor calibration. */
(function () {
  injectFeedbackModal();
  const sensor=SensorService, $=id=>document.getElementById(id);
  let restCapture=null, busy=false, disposed=false, captureGeneration=0, lastMode=sensor.getMode();
  const cleanupPanel=ReGripSensorUI.mount($('calibration-sensor-controls'));
  const error=$('calibration-error'), first=$('btn-cap-1'), second=$('btn-cap-2'), start=$('btn-start');
  const returnTo=new URLSearchParams(location.search).get('return');
  const gamePages=['game-balloon.html','game-crane.html','game-rhythm.html','game-glide.html'];
  start.onclick=()=>{location.href=gamePages.includes(returnTo)?returnTo:'training.html';};
  function showError(message){error.textContent=message||'';}
  function sync(){
    if(disposed)return;
    const mode=sensor.getMode(),connected=sensor.getStatus()==='connected';
    first.disabled=busy||!connected||mode==='simulation';
    second.disabled=busy||!connected||!restCapture||mode==='simulation';
    start.disabled=busy||!sensor.isReady();
    start.textContent=mode==='simulation'?'시뮬레이션으로 연습하기':'운동 시작하기';
    start.classList.toggle('unlocked',!start.disabled);
    $('sim-hint').textContent=mode==='simulation'?'센서 없이 조작을 연습할 수 있습니다. 센서 보정은 연결 후 진행해 주세요.':'실제 압력 센서 입력입니다. 표시 값은 kg 단위가 아닙니다.';
    const cal=sensor.getCalibration();
    $('existing-cal').classList.toggle('hidden',!cal);
    if(cal)$('existing-cal-detail').textContent=`저장된 기준: 이완 ${Math.round(cal.baseline0)} / 편안한 쥐기 ${Math.round(cal.baseline100)} ${mode==='ble'?'ADC':'%'}`;
  }
  function meter(sample){
    if(disposed)return;
    const force=sensor.getForce();
    $('live-meter-fill').style.height=Math.max(0,Math.min(100,force))+'%';
    $('live-value').textContent=Math.round(force)+'%';
    if(sample && typeof sample==='object'){
      const raw=sensor.getMode()==='websocket'?sample.forceRaw:sample.fsrRaw;
      $('calibration-raw').textContent=Number.isFinite(raw)?`압력 원본값 ${Math.round(raw)} ${sensor.getMode()==='ble'?'ADC':'%'}`:'';
    }
  }
  function mark(n){
    const step=$('step-'+n); step.classList.remove('step-active','step-locked');step.classList.add('step-done');
    $('step-'+n+'-number').textContent='✓';
    $('btn-cap-'+n).textContent='기록 완료';
  }
  function reset(message=''){
    captureGeneration++;restCapture=null;showError(message);
    for(const n of [1,2]){
      $('step-'+n).classList.remove('step-done','step-active','step-locked');
      $('step-'+n).classList.add(n===1?'step-active':'step-locked');
      $('step-'+n+'-number').textContent='0'+n;
      $('btn-cap-'+n).textContent=n===1?'이완 상태 1초 기록':'편안한 쥐기 1초 기록';
    }
    $('baseline-info').classList.add('hidden');
    $('b0-info').textContent='';$('b100-info').textContent='';
    sync();
  }
  function onStatus(){
    const mode=sensor.getMode();
    if((busy||restCapture)&&(mode!==lastMode||sensor.getStatus()!=='connected'))reset('센서 입력이 바뀌거나 끊겼습니다. 연결 후 이완 기준부터 다시 측정해 주세요.');
    lastMode=mode;sync();
  }
  function captureLegacy(){
    return new Promise((resolve,reject)=>{
      const values=[];let last=performance.now(),maxGap=0;
      const onSample=s=>{if(sensor.getMode()!=='websocket')return;const gap=performance.now()-last;last=performance.now();maxGap=Math.max(maxGap,gap);if(Number.isFinite(s.forceRaw))values.push(s.forceRaw);};
      sensor.onRawSample(onSample);
      setTimeout(()=>{
        sensor.offRawSample(onSample);
        if(disposed||sensor.getMode()!=='websocket'||sensor.getStatus()!=='connected'||values.length<15||Math.max(maxGap,performance.now()-last)>150)return reject(new Error('센서 입력이 충분하지 않습니다. 연결을 확인하고 다시 측정해 주세요.'));
        values.sort((a,b)=>a-b);
        resolve({baseline:values[Math.floor(values.length/2)],spread:values[Math.floor((values.length-1)*.95)]-values[Math.floor((values.length-1)*.05)],mode:'websocket'});
      },1000);
    });
  }
  window.captureBaseline=async function(n){
    if(busy)return;
    if(sensor.getMode()==='simulation'){showError('실제 센서를 연결해야 보정 기준을 저장할 수 있습니다.');return;}
    if(sensor.getStatus()!=='connected'){showError('센서 연결을 먼저 확인해 주세요.');return;}
    busy=true;showError('');sync();const button=n===1?first:second;button.textContent='1초 동안 자세를 유지해 주세요';
    const generation=++captureGeneration;
    try{
      const mode=sensor.getMode();
      const capture=mode==='ble'?await sensor.captureBaseline():await captureLegacy();
      if(disposed||generation!==captureGeneration)return;
      if(n===1){
        restCapture={...capture,mode};
        mark(1);$('step-2').classList.remove('step-locked','step-done');$('step-2').classList.add('step-active');
        $('baseline-info').classList.remove('hidden');$('b0-info').textContent=`이완 기준: ${Math.round(capture.baseline)}`;$('b100-info').textContent='';
      }else{
        if(!restCapture||restCapture.mode!==mode)throw new Error('입력 장치가 바뀌었습니다. 이완 기준부터 다시 측정해 주세요.');
        if(mode==='ble')await sensor.saveBleCalibration(restCapture,capture);
        else{
          const span=Math.abs(capture.baseline-restCapture.baseline);
          if(capture.baseline<=restCapture.baseline||span<1||restCapture.spread>span*.2||capture.spread>span*.2)throw new Error('두 기준이 너무 가깝거나 불안정합니다. 힘을 풀고 이완 기준부터 다시 측정해 주세요.');
          const cal={baseline0:restCapture.baseline,baseline100:capture.baseline,date:new Date().toISOString()};
          await DataService.saveCalibration(cal);sensor.setCalibration(cal);
        }
        if(disposed||generation!==captureGeneration)return;
        mark(2);$('b100-info').textContent=`쥐기 기준: ${Math.round(capture.baseline)}`;
        showToast('보정 기준을 저장했어요',{type:'success'});
      }
    }catch(e){if(!disposed&&generation===captureGeneration){showError(e.message||'보정하지 못했습니다. 다시 측정해 주세요.');button.textContent='다시 측정';}}
    finally{busy=false;sync();}
  };
  $('reset-calibration').onclick=()=>reset();
  sensor.onStatusChange(onStatus);sensor.onRawSample(meter);sensor.onForceUpdate(meter);
  // Screen reader updates come from the user-triggered capture status; the live number is visual only.
  $('live-value').removeAttribute('aria-live');
  function cleanup(){disposed=true;captureGeneration++;cleanupPanel();sensor.offStatusChange(onStatus);sensor.offRawSample(meter);sensor.offForceUpdate(meter);}
  window.addEventListener('pagehide',cleanup,{once:true});
  reset();meter(sensor.getRawSample());
})();
  </script>
</body>
</html>
