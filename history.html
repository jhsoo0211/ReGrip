<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReGrip — 기록 및 통계</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=DM+Sans:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script src="tailwind-config.js"></script>
<style>
  /* Tabs — appearance driven ONLY by .tab-btn / .tab-btn.active (no inline styles) */
  .tab-btn {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #58423a;
    border: 2px solid #0F172A;
    box-shadow: none;
    transition: background 0.15s, color 0.15s, box-shadow 0.1s, transform 0.1s;
  }
  .tab-btn.active {
    background: #994626;
    color: #fff;
    border-color: #0F172A;
    box-shadow: 3px 3px 0px #0F172A;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* CSS bar chart */
  .bar-col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .bar-track { width: 100%; background: #FFE9E3; border: 2px solid #0F172A; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .bar-fill  { background: #994626; border-radius: 2px; transition: height 0.6s ease; }
  .bar-label { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #58423a; text-align: center; }
  .bar-val   { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; color: #251915; transition: transform 0.15s ease, color 0.15s ease; }
  .bar-col:hover .bar-val  { transform: scale(1.18); color: #994626; }
  .bar-col:hover .bar-fill { filter: brightness(1.08); }

  /* Stats empty-state helpers */
  .stat-muted { color: var(--ink-muted) !important; }
  .chart-placeholder {
    flex: 1;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border: 2px dashed #0F172A;
    border-radius: 12px;
    color: var(--ink-secondary);
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.5;
    padding: 16px;
  }

  /* Session card entrance + hover (own CSS so hover transform never fights Tailwind) */
  .session-card { opacity: 0; transform: translateY(14px); transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out); }
  .session-card.in { opacity: 1; transform: translateY(0); }
  .session-card.in:hover { transform: translateY(-3px); }

  /* Decorative number marker (number-details) */
  .card-index {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: #dfc0b6;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }

  /* Session Detail Modal */
  #session-detail-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(15,23,42,0.6);
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fadeIn 0.15s ease;
  }
  #session-detail-modal.open { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .detail-card {
    background: #FFF8F6;
    border: 4px solid #0F172A;
    box-shadow: 8px 8px 0px #0F172A;
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.2s ease;
  }

  .detail-banner {
    background: #FFE9E3;
    border-bottom: 4px solid #0F172A;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .detail-body { padding: 24px; }

  .force-bar-bg {
    height: 14px;
    background: #f5ded7;
    border: 2px solid #0F172A;
    border-radius: 999px;
    overflow: hidden;
  }
  .force-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.5s ease;
  }

  .set-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #f5ded7;
  }
  .set-row:last-child { border-bottom: none; }

  .set-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 2px solid #0F172A;
    background: #FFE9E3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }
</style>
</head>
<body class="bg-background-sky text-on-surface">

<div class="app-shell">
  <div id="nav-sidebar"></div>

  <main class="app-main w-full">
    <div class="max-w-[1100px] mx-auto px-8 py-8 flex flex-col gap-6">

      <!-- Header -->
      <section class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 border-b-4 border-ink-black pb-6">
        <div>
          <h1 class="font-display text-4xl md:text-5xl font-bold uppercase tracking-tight mb-2 flex items-center gap-3">
            <span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings:'FILL' 1">timeline</span>
            기록 및 통계
          </h1>
          <p class="text-on-surface-variant text-lg">훈련 세션 기록과 악력 발전 추세를 확인하세요.</p>
        </div>
        <!-- Total sessions badge -->
        <div id="total-badge" class="bg-surface-container-high retro-border retro-shadow px-6 py-4 rounded-xl flex flex-col items-center min-w-[130px]">
          <span class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">총 세션</span>
          <span id="total-sessions" class="font-display text-2xl font-bold text-primary">0</span>
        </div>
      </section>

      <!-- Tabs -->
      <div class="flex gap-3">
        <button type="button" onclick="switchTab('log')" id="tab-log"
                class="tab-btn active font-display font-bold text-sm uppercase tracking-wider px-6 py-2.5 rounded">
          기록
        </button>
        <button type="button" onclick="switchTab('stats')" id="tab-stats"
                class="tab-btn font-display font-bold text-sm uppercase tracking-wider px-6 py-2.5 rounded">
          통계
        </button>
      </div>

      <!-- Tab: Session Log -->
      <div id="content-log" class="tab-content active">
        <div id="session-list" class="flex flex-col gap-4"></div>
      </div>

      <!-- Tab: Stats -->
      <div id="content-stats" class="tab-content">

        <!-- Personal Bests -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          <div class="bg-white retro-border retro-shadow rounded-xl p-5 text-center">
            <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">최대 악력</div>
            <div id="stat-max-force" class="font-display text-2xl font-bold text-primary">—</div>
            <div class="text-xs text-on-surface-variant mt-1">%</div>
          </div>
          <div class="bg-white retro-border retro-shadow rounded-xl p-5 text-center">
            <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">총 세션</div>
            <div id="stat-total" class="font-display text-2xl font-bold text-primary">—</div>
            <div class="text-xs text-on-surface-variant mt-1">회</div>
          </div>
          <div class="bg-white retro-border retro-shadow rounded-xl p-5 text-center">
            <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">평균 세트</div>
            <div id="stat-avg-sets" class="font-display text-2xl font-bold text-primary">—</div>
            <div class="text-xs text-on-surface-variant mt-1">세트</div>
          </div>
          <div class="bg-white retro-border retro-shadow rounded-xl p-5 text-center">
            <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">연속 출석</div>
            <div id="stat-streak" class="font-display text-2xl font-bold text-primary">—</div>
            <div class="text-xs text-on-surface-variant mt-1">일</div>
          </div>
        </div>

        <!-- Weekly Force Chart -->
        <div class="bg-white retro-border retro-shadow rounded-xl p-6">
          <h3 class="font-display text-base font-bold uppercase tracking-wide mb-6">주간 평균 악력 (최근 7일)</h3>
          <div id="force-chart" class="flex items-end gap-2 h-[180px]"></div>
        </div>

      </div>

    </div>
  </main>

  <div id="nav-bottom"></div>
</div>

<!-- Session Detail Modal -->
<div id="session-detail-modal" aria-modal="true" role="dialog">
  <div class="detail-card" id="detail-card-content"></div>
</div>

<script src="shared.js"></script>
<script>
initPage('history');

let _allSessions = [];
let _lastFocused = null;

function switchTab(name) {
  ['log', 'stats'].forEach(t => {
    document.getElementById(`content-${t}`).classList.toggle('active', t === name);
    document.getElementById(`tab-${t}`).classList.toggle('active', t === name);
  });
  if (name === 'stats') animateChart();
}

function starsHtml(n) {
  return [1,2,3].map(i =>
    `<span class="material-symbols-outlined text-sm ${i<=n?'text-yellow-400':'text-on-surface-variant'}"
          style="font-variation-settings:'FILL' ${i<=n?1:0}">star</span>`
  ).join('');
}

function starsHtmlLg(n) {
  return [1,2,3].map(i =>
    `<span class="material-symbols-outlined text-2xl ${i<=n?'text-yellow-400':'text-on-surface-variant'}"
          style="font-variation-settings:'FILL' ${i<=n?1:0}">star</span>`
  ).join('');
}

// Per-set row. Real game rows (balloon/crane) carry {setNum, force, holdSecs} with no `reps`
// — omit the "N회 반복" label rather than printing "undefined회 반복" (F2). Crane rows may add
// a `releaseSecs` (이완) column when present.
function setRowHtml(s) {
  const repsLabel = (s.reps != null)
    ? `<span class="text-sm font-bold">${s.reps}회 반복</span>`
    : `<span></span>`;
  const holdCol = (s.holdSecs != null) ? `
        <div class="text-right flex-shrink-0" style="min-width:50px;">
          <div class="text-xs text-on-surface-variant">유지</div>
          <div class="font-display text-sm font-bold tabular">${s.holdSecs}초</div>
        </div>` : '';
  const releaseCol = (s.releaseSecs != null) ? `
        <div class="text-right flex-shrink-0" style="min-width:50px;">
          <div class="text-xs text-on-surface-variant">이완</div>
          <div class="font-display text-sm font-bold tabular">${s.releaseSecs}초</div>
        </div>` : '';
  return `
        <div class="set-row">
          <div class="set-num tabular">${s.setNum}</div>
          <div class="flex-1">
            <div class="flex justify-between items-center mb-1">
              ${repsLabel}
              <span class="font-display text-sm font-bold text-primary tabular">${s.force}%</span>
            </div>
            <div class="force-bar-bg" style="height:8px;">
              <div class="force-bar-fill bg-primary" style="width:${s.force}%;height:100%"></div>
            </div>
          </div>
          ${holdCol}${releaseCol}
        </div>`;
}

function openSessionDetail(sessionIndex) {
  const session = _allSessions[sessionIndex];
  if (!session) return;

  _lastFocused = document.activeElement;
  const modal = document.getElementById('session-detail-modal');
  const card = document.getElementById('detail-card-content');
  const setData = deriveSetDetails(session);
  // 세션에 실제 setDetails가 없으면 deriveSetDetails가 결정론적으로 파생한 값 → "추정치" 배지 표시.
  const isDerived = !(session && Array.isArray(session.setDetails) && session.setDetails.length);
  const derivedBadge = isDerived
    ? `<span class="font-display text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded ml-2" style="background:#FEF9C3;border:2px solid #CA8A04;color:#CA8A04;">추정치</span>`
    : '';
  const icon = iconForSession(session);
  const durationMin = session.durationMin ?? Math.round((session.durationSec || 0) / 60);
  const isCrane = gameIdOf(session) === 'crane';
  const attemptsRow = (isCrane && typeof session.attempts === 'number') ? `
      <div class="bg-white retro-border rounded-xl p-4 flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-surface-container retro-border flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-primary text-base" style="font-variation-settings:'FILL' 1">${icon}</span>
        </div>
        <div>
          <div class="font-display text-[10px] font-bold tracking-widest text-on-surface-variant uppercase">크레인 시도</div>
          <div class="font-bold text-sm">시도 ${session.attempts}회 중 ${session.sets}개 성공</div>
        </div>
      </div>` : '';

  card.innerHTML = `
    <!-- Banner -->
    <div class="detail-banner">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-surface-container-highest retro-border flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-primary text-lg" style="font-variation-settings:'FILL' 1">${icon}</span>
        </div>
        <div>
          <div class="font-display font-bold text-base uppercase tracking-wide">${session.label}</div>
          <div class="text-on-surface-variant text-xs">${formatKoreanDate(session.date)}</div>
        </div>
      </div>
      <button type="button" data-modal-close onclick="closeSessionDetail()" aria-label="닫기"
              class="w-11 h-11 rounded-lg retro-border bg-white flex items-center justify-center hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="detail-body flex flex-col gap-5">

      <!-- Star Rating -->
      <div class="flex justify-center gap-1">
        ${starsHtmlLg(session.stars)}
      </div>

      <!-- Summary Stats Grid -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white retro-border rounded-xl p-4 text-center">
          <div class="font-display text-[10px] font-bold tracking-widest text-on-surface-variant uppercase mb-1">소요 시간</div>
          <div class="font-display text-xl font-bold text-primary tabular">${durationMin}</div>
          <div class="text-xs text-on-surface-variant">분</div>
        </div>
        <div class="bg-white retro-border rounded-xl p-4 text-center">
          <div class="font-display text-[10px] font-bold tracking-widest text-on-surface-variant uppercase mb-1">총 세트</div>
          <div class="font-display text-xl font-bold text-primary tabular">${session.sets}</div>
          <div class="text-xs text-on-surface-variant">세트</div>
        </div>
        <div class="bg-white retro-border rounded-xl p-4 text-center">
          <div class="font-display text-[10px] font-bold tracking-widest text-on-surface-variant uppercase mb-1">최대 악력</div>
          <div class="font-display text-xl font-bold text-primary tabular">${session.maxForce}</div>
          <div class="text-xs text-on-surface-variant">%</div>
        </div>
      </div>

      ${attemptsRow}

      <!-- Force Bars -->
      <div class="bg-white retro-border rounded-xl p-4">
        <div class="flex justify-between items-center mb-3">
          <span class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase">평균 악력</span>
          <span class="font-display text-lg font-bold text-primary tabular">${session.avgForce}%</span>
        </div>
        <div class="force-bar-bg">
          <div class="force-bar-fill bg-primary" style="width:${session.avgForce}%"></div>
        </div>
        <div class="flex justify-between items-center mb-3 mt-4">
          <span class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase">최대 악력</span>
          <span class="font-display text-lg font-bold tabular" style="color:#16A34A">${session.maxForce}%</span>
        </div>
        <div class="force-bar-bg">
          <div class="force-bar-fill" style="width:${session.maxForce}%;background:#16A34A"></div>
        </div>
      </div>

      <!-- Per-Set Breakdown -->
      <div class="bg-white retro-border rounded-xl overflow-hidden">
        <div class="bg-surface-container border-b-2 border-ink-black px-4 py-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-base" style="font-variation-settings:'FILL' 1">format_list_numbered</span>
          <span class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase">세트별 상세</span>
          ${derivedBadge}
        </div>
        <div class="px-4 py-2">
          ${setData.map(setRowHtml).join('')}
        </div>
      </div>

      <!-- Close Button -->
      <button type="button" onclick="closeSessionDetail()"
              class="w-full bg-primary text-white font-display font-bold text-sm uppercase tracking-wider py-3 rounded-xl retro-border retro-shadow hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        기록 목록으로 돌아가기
      </button>
    </div>
  `;

  modal.classList.add('open');
  const closeBtn = card.querySelector('[data-modal-close]');
  if (closeBtn) closeBtn.focus();
}

function closeSessionDetail() {
  const modal = document.getElementById('session-detail-modal');
  if (!modal.classList.contains('open')) return;
  modal.classList.remove('open');
  if (_lastFocused && typeof _lastFocused.focus === 'function') _lastFocused.focus();
}

// Close on backdrop click
document.getElementById('session-detail-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('session-detail-modal')) closeSessionDetail();
});

// Close on Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSessionDetail();
});

function staggerIn(nodes) {
  const reduce = prefersReducedMotion();
  nodes.forEach((n, i) => {
    const d = reduce ? 0 : Math.min(i * 50, 400);
    setTimeout(() => n.classList.add('in'), d);
  });
}

function renderLog(sessions) {
  const list = document.getElementById('session-list');
  if (!sessions.length) {
    renderEmptyState(list, {
      icon: 'timeline',
      title: '아직 세션 기록이 없습니다',
      desc: '첫 훈련을 완료하면 여기에 세션 기록이 쌓입니다.',
      ctaHref: 'training.html',
      ctaLabel: '첫 훈련 시작하기',
      secondaryHref: 'history.html?demo=1',
      secondaryLabel: '데모 데이터 보기',
    });
    return;
  }
  list.innerHTML = sessions.map((s, idx) => {
    const durationMin = s.durationMin ?? Math.round((s.durationSec || 0) / 60);
    return `
    <div class="session-card bg-white retro-border retro-shadow rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 cursor-pointer"
         role="button" tabindex="0" aria-label="${s.label} 세션 상세 보기"
         onclick="openSessionDetail(${idx})"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openSessionDetail(${idx});}">
      <div class="flex items-center gap-4">
        <span class="card-index tabular" aria-hidden="true">${String(idx + 1).padStart(2, '0')}</span>
        <div class="w-10 h-10 rounded-full bg-surface-container retro-border flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined text-primary text-lg" style="font-variation-settings:'FILL' 1">${iconForSession(s)}</span>
        </div>
        <div>
          <div class="font-display font-bold text-base">${s.label}</div>
          <div class="text-on-surface-variant text-sm">${formatKoreanDate(s.date)} · ${durationMin}분 · ${s.sets}세트</div>
        </div>
      </div>
      <div class="flex items-center gap-4 flex-shrink-0">
        <div class="text-center">
          <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase">평균 악력</div>
          <div class="font-display text-lg font-bold text-primary tabular">${s.avgForce}%</div>
        </div>
        <div class="flex gap-0.5">${starsHtml(s.stars)}</div>
        <span class="material-symbols-outlined text-on-surface-variant text-lg">chevron_right</span>
      </div>
    </div>`;
  }).join('');
  staggerIn(Array.from(list.querySelectorAll('.session-card')));
}

function animateChart() {
  const fills = document.querySelectorAll('#force-chart .bar-fill');
  if (!fills.length) return;
  if (prefersReducedMotion()) {
    fills.forEach(f => { f.style.height = (f.dataset.h || 0) + '%'; });
    return;
  }
  fills.forEach(f => { f.style.height = '0%'; });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fills.forEach(f => { f.style.height = (f.dataset.h || 0) + '%'; });
  }));
}

function renderStats(sessions, stats) {
  const els = {
    max:    document.getElementById('stat-max-force'),
    total:  document.getElementById('stat-total'),
    avg:    document.getElementById('stat-avg-sets'),
    streak: document.getElementById('stat-streak'),
  };
  const chart = document.getElementById('force-chart');

  if (!sessions.length) {
    Object.values(els).forEach(el => { el.textContent = '—'; el.classList.add('stat-muted'); });
    chart.innerHTML = `<div class="chart-placeholder">훈련 데이터가 쌓이면<br/>주간 차트가 표시됩니다</div>`;
    return;
  }

  Object.values(els).forEach(el => el.classList.remove('stat-muted'));
  els.max.textContent    = stats.maxForce;
  els.total.textContent  = stats.totalSessions;
  els.avg.textContent    = stats.avgSets;
  els.streak.textContent = stats.streak;

  // 7-day average-force chart (bars start at 0; animateChart plays them in)
  const today = new Date(); today.setHours(0,0,0,0);
  const dayLabels = ['일','월','화','수','목','금','토'];
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const dayStr = d.toDateString();
    const daySessions = sessions.filter(s => new Date(s.date).toDateString() === dayStr);
    const avg = daySessions.length ? Math.round(daySessions.reduce((a,s) => a + (s.avgForce || 0), 0) / daySessions.length) : 0;
    last7.push({ label: dayLabels[d.getDay()], value: avg });
  }
  const maxVal = Math.max(...last7.map(d => d.value), 1);
  chart.innerHTML = last7.map(d => `
    <div class="bar-col">
      <div class="bar-val tabular">${d.value > 0 ? d.value + '%' : ''}</div>
      <div class="bar-track" style="height:140px;">
        <div class="bar-fill" data-h="${Math.round((d.value / maxVal) * 100)}" style="height:0%;"></div>
      </div>
      <div class="bar-label">${d.label}</div>
    </div>
  `).join('');
}

// Render — one stats read gives streak + aggregates; getSessions gives the full source list.
(async () => {
  const [stats, sessions] = await Promise.all([
    GamificationEngine.getStats(),
    DataService.getSessions(),
  ]);
  _allSessions = sessions;
  animateCount(document.getElementById('total-sessions'), sessions.length);
  renderLog(sessions);
  renderStats(sessions, stats);
})();
</script>
</body>
</html>
