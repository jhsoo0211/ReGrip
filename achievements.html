<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReGrip — 나의 업적</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=DM+Sans:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script src="tailwind-config.js"></script>
<style>
  /* Achievement Detail Modal */
  #achievement-detail-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(15,23,42,0.6);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #achievement-detail-modal.open { display: flex; }

  @keyframes achSlideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes achPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  .ach-detail-card {
    background: #FFF8F6;
    border: 4px solid #0F172A;
    box-shadow: 8px 8px 0px #0F172A;
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    animation: achSlideUp 0.2s ease;
  }

  .ach-detail-banner {
    border-bottom: 4px solid #0F172A;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .ach-detail-body { padding: 28px 24px; }

  .ach-icon-lg {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 4px solid #0F172A;
    box-shadow: 4px 4px 0px #0F172A;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    position: relative;
  }
  .ach-icon-lg img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .ach-icon-lg.earned { background: #FFE9E3; animation: achPulse 2s ease-in-out infinite; }
  .ach-icon-lg.locked { background: #f5ded7; }

  .ach-progress-bar-bg {
    height: 12px;
    background: #f5ded7;
    border: 2px solid #0F172A;
    border-radius: 999px;
    overflow: hidden;
  }
  .ach-progress-bar-fill {
    height: 100%;
    background: #994626;
    border-radius: 999px;
    transition: width 0.6s ease;
  }

  .reward-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 2px solid #0F172A;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Inline retro badge (no external image — icon font + CSS circle) */
  .ach-badge {
    width: 112px; height: 112px;
    border-radius: 50%;
    border: 2px solid #0F172A;
    box-shadow: 4px 4px 0px #0F172A;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    flex-shrink: 0;
  }
  .ach-badge .ach-badge-icon { font-size: 52px; color: #251915; }
  .ach-badge.locked {
    background: #f5ded7;
    border-color: #dfc0b6;
    box-shadow: 4px 4px 0px #dfc0b6;
    filter: grayscale(1);
  }
  .ach-badge.locked .ach-badge-icon { color: #58423a; opacity: 0.4; }
  .ach-badge-lock { position: absolute; font-size: 46px; color: #58423a; }

  /* Decorative corner marker (number-details) */
  .ach-corner-num {
    position: absolute;
    top: 12px; right: 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 13px;
    letter-spacing: 0.14em;
    color: #dfc0b6;
    z-index: 2;
  }

  /* Locked progress bar */
  .ach-prog-bg {
    height: 12px;
    background: #f5ded7;
    border: 2px solid #dfc0b6;
    border-radius: 999px;
    overflow: hidden;
  }
  .ach-prog-fill {
    height: 100%;
    background: #58423a;
    border-radius: 999px;
    transition: width 0.6s var(--ease-out);
  }

  /* Card entrance + hover (own CSS; hover beats resting via higher specificity) */
  .ach-card { opacity: 0; transform: translateY(14px); transition: opacity 0.4s var(--ease-out), transform 0.4s var(--ease-out); }
  .ach-card.in { opacity: 1; transform: translateY(0); }
  .ach-card.in:hover { transform: translateY(-5px); }

  /* Modal icon glyph size */
  .ach-icon-lg .ach-modal-icon { font-size: 56px; }
</style>
</head>
<body class="bg-background-sky text-on-surface">

<div class="app-shell">
  <div id="nav-sidebar"></div>

  <main class="app-main w-full">
    <div class="max-w-[1100px] mx-auto px-8 py-8 flex flex-col gap-6">

      <!-- Header -->
      <section class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 border-b-4 border-ink-black pb-6">
        <div>
          <h1 class="font-display text-4xl md:text-5xl font-bold text-on-surface uppercase tracking-tight mb-2 flex items-center gap-3">
            <span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings:'FILL' 1">emoji_events</span>
            나의 업적
          </h1>
          <p class="text-on-surface-variant text-lg">게임 목표를 달성하고 보상을 잠금 해제하세요.</p>
        </div>
        <div class="bg-surface-container-high retro-border retro-shadow px-6 py-4 rounded-xl flex flex-col items-center min-w-[130px]">
          <span class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-1">총 획득 배지</span>
          <span id="ach-count" class="font-display text-2xl font-bold text-primary tabular">— / —</span>
        </div>
      </section>

      <!-- Achievements Grid (rendered from GamificationEngine.getStats().achievements) -->
      <section id="ach-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>
    </div>
  </main>

  <div id="nav-bottom"></div>
</div>

<!-- Achievement Detail Modal -->
<div id="achievement-detail-modal" aria-modal="true" role="dialog">
  <div class="ach-detail-card" id="ach-detail-content"></div>
</div>

<script src="shared.js"></script>
<script>
initPage('achievements');

let _achievements = [];
let _lastFocused = null;

function badgeHtml(a) {
  if (a.earned) {
    const bg = (RARITY_STYLE[a.rarity] || {}).bg || '#FFE9E3';
    return `<div class="ach-badge earned" style="background:${bg}">
        <span class="material-symbols-outlined ach-badge-icon" style="font-variation-settings:'FILL' 1">${a.icon}</span>
      </div>`;
  }
  return `<div class="ach-badge locked">
      <span class="material-symbols-outlined ach-badge-icon" style="font-variation-settings:'FILL' 1">${a.icon}</span>
      <span class="material-symbols-outlined ach-badge-lock" style="font-variation-settings:'FILL' 1">lock</span>
    </div>`;
}

function achCardHtml(a, i) {
  const nn = String(i + 1).padStart(2, '0');
  const rarity = RARITY_STYLE[a.rarity] || RARITY_STYLE['일반'];
  if (a.earned) {
    return `
      <article class="ach-card bg-white retro-border retro-shadow rounded-xl p-6 flex flex-col items-center text-center relative overflow-hidden cursor-pointer"
               role="button" tabindex="0" data-idx="${i}" aria-label="${a.title} 업적 상세 보기 (획득함)">
        <span class="ach-corner-num" aria-hidden="true">${nn}</span>
        <div class="absolute top-0 left-0 w-full h-2 border-b-2 border-ink-black" style="background:${rarity.color}"></div>
        <div class="mt-3 mb-5">${badgeHtml(a)}</div>
        <h3 class="font-display text-lg font-bold mb-2">${a.title}</h3>
        <p class="text-on-surface-variant text-sm mb-4 flex-1">${a.desc}</p>
        <div class="w-full border-t-2 border-ink-black pt-4 flex justify-center items-center gap-2">
          <span class="material-symbols-outlined text-base" style="color:var(--success);font-variation-settings:'FILL' 1">check_circle</span>
          <span class="font-display text-sm font-bold">획득 ${a.earnedDate}</span>
        </div>
      </article>`;
  }
  return `
      <article class="ach-card bg-surface-container-high retro-border rounded-xl p-6 flex flex-col items-center text-center relative overflow-hidden cursor-pointer"
               style="border-color:#dfc0b6;"
               role="button" tabindex="0" data-idx="${i}" aria-label="${a.title} 업적 상세 보기 (미획득)">
        <span class="ach-corner-num" aria-hidden="true">${nn}</span>
        <div class="absolute top-0 left-0 w-full h-2 rounded-t-xl" style="background:#dfc0b6;"></div>
        <div class="mt-3 mb-5">${badgeHtml(a)}</div>
        <h3 class="font-display text-lg font-bold mb-2 text-on-surface-variant">${a.title}</h3>
        <p class="text-on-surface-variant text-sm mb-4 flex-1">${a.desc}</p>
        <div class="w-full pt-4" style="border-top:2px solid #dfc0b6;">
          <div class="flex justify-between items-center mb-2">
            <span class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase">진행률</span>
            <span class="font-display text-sm font-bold tabular">${a.progressLabel}</span>
          </div>
          <div class="ach-prog-bg">
            <div class="ach-prog-fill" data-pct="${a.progressPct}" style="width:0%"></div>
          </div>
        </div>
      </article>`;
}

function renderAchievements(list) {
  const grid = document.getElementById('ach-grid');
  grid.innerHTML = list.map((a, i) => achCardHtml(a, i)).join('');

  const cards = Array.from(grid.querySelectorAll('.ach-card'));
  cards.forEach(card => {
    const idx = +card.dataset.idx;
    card.addEventListener('click', () => openAchievementDetail(idx));
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAchievementDetail(idx); }
    });
  });

  const reduce = prefersReducedMotion();
  // entrance stagger
  cards.forEach((c, i) => setTimeout(() => c.classList.add('in'), reduce ? 0 : Math.min(i * 70, 490)));
  // progress bars 0 -> value
  const fills = grid.querySelectorAll('.ach-prog-fill');
  if (reduce) {
    fills.forEach(f => { f.style.width = (f.dataset.pct || 0) + '%'; });
  } else {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fills.forEach(f => { f.style.width = (f.dataset.pct || 0) + '%'; });
    }));
  }
}

function openAchievementDetail(index) {
  const a = _achievements[index];
  if (!a) return;

  _lastFocused = document.activeElement;
  const modal = document.getElementById('achievement-detail-modal');
  const card = document.getElementById('ach-detail-content');
  const rarity = RARITY_STYLE[a.rarity] || RARITY_STYLE['일반'];

  const iconContent = a.earned
    ? `<span class="material-symbols-outlined ach-modal-icon" style="color:#251915;font-variation-settings:'FILL' 1">${a.icon}</span>`
    : `<span class="material-symbols-outlined ach-modal-icon text-on-surface-variant" style="font-variation-settings:'FILL' 1">lock</span>`;

  const remaining = Math.max(0, Math.round(100 - a.progressPct));
  const statusSection = a.earned
    ? `
      <div class="flex items-center justify-center gap-2 py-3 px-5 bg-white retro-border rounded-xl">
        <span class="material-symbols-outlined text-lg" style="color:var(--success);font-variation-settings:'FILL' 1">check_circle</span>
        <span class="font-display text-sm font-bold" style="color:var(--success)">획득 완료</span>
        <span class="text-on-surface-variant text-sm ml-2">${a.earnedDate}</span>
      </div>
    `
    : `
      <div class="bg-white retro-border rounded-xl p-4">
        <div class="flex justify-between items-center mb-2">
          <span class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase">진행률</span>
          <span class="font-display text-sm font-bold text-primary tabular">${a.progressLabel}</span>
        </div>
        <div class="ach-progress-bar-bg">
          <div class="ach-progress-bar-fill" style="width:${a.progressPct}%"></div>
        </div>
        <p class="text-on-surface-variant text-xs mt-2 text-center">목표까지 ${remaining}% 남았습니다.</p>
      </div>
    `;

  card.innerHTML = `
    <!-- Banner -->
    <div class="ach-detail-banner" style="background:${a.earned ? '#DCFCE7' : '#f5ded7'};">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-lg" style="font-variation-settings:'FILL' 1;color:${a.earned ? '#16A34A' : '#58423a'}">${a.earned ? 'emoji_events' : 'lock'}</span>
        <span class="font-display font-bold text-sm uppercase tracking-widest">${a.earned ? '획득한 업적' : '미획득 업적'}</span>
      </div>
      <button type="button" data-modal-close onclick="closeAchievementDetail()" aria-label="닫기"
              class="w-11 h-11 rounded-lg retro-border bg-white flex items-center justify-center hover:bg-surface-container transition-colors">
        <span class="material-symbols-outlined text-base">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="ach-detail-body flex flex-col gap-5">

      <!-- Icon -->
      <div class="ach-icon-lg ${a.earned ? 'earned' : 'locked'}" ${a.earned ? `style="background:${rarity.bg}"` : ''}>
        ${iconContent}
      </div>

      <!-- Title & Rarity -->
      <div class="text-center">
        <h2 class="font-display text-2xl font-bold mb-2">${a.title}</h2>
        <div class="flex justify-center gap-2 flex-wrap">
          <span class="reward-tag" style="background:${rarity.bg};border-color:${rarity.color};color:${rarity.color}">
            <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">diamond</span>
            ${a.rarity}
          </span>
          <span class="reward-tag" style="background:#FFE9E3;border-color:#994626;color:#994626">
            <span class="material-symbols-outlined text-sm" style="font-variation-settings:'FILL' 1">category</span>
            ${a.category}
          </span>
        </div>
      </div>

      <!-- Status -->
      ${statusSection}

      <!-- Description -->
      <div class="bg-white retro-border rounded-xl p-4">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">상세 설명</div>
        <p class="text-on-surface text-sm leading-relaxed">${a.desc}</p>
      </div>

      <!-- Condition -->
      <div class="bg-white retro-border rounded-xl p-4">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">획득 조건</div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-surface-container retro-border flex items-center justify-center flex-shrink-0">
            <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings:'FILL' 1">task_alt</span>
          </div>
          <span class="font-bold text-sm">${a.condition}</span>
        </div>
      </div>

      <!-- Reward -->
      <div class="bg-white retro-border rounded-xl p-4">
        <div class="font-display text-xs font-bold tracking-widest text-on-surface-variant uppercase mb-2">보상</div>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background:#FEF9C3;border:2px solid #CA8A04;">
            <span class="material-symbols-outlined text-sm" style="color:#CA8A04;font-variation-settings:'FILL' 1">stars</span>
          </div>
          <span class="font-display font-bold text-sm text-primary tabular">${a.xp} XP</span>
          <span class="text-on-surface-variant text-xs">경험치 획득</span>
        </div>
      </div>

      <!-- Close Button -->
      <button type="button" onclick="closeAchievementDetail()"
              class="w-full bg-primary text-white font-display font-bold text-sm uppercase tracking-wider py-3 rounded-xl retro-border retro-shadow hover:opacity-90 transition-opacity flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        업적 목록으로 돌아가기
      </button>
    </div>
  `;

  modal.classList.add('open');
  const closeBtn = card.querySelector('[data-modal-close]');
  if (closeBtn) closeBtn.focus();
}

function closeAchievementDetail() {
  const modal = document.getElementById('achievement-detail-modal');
  if (!modal.classList.contains('open')) return;
  modal.classList.remove('open');
  if (_lastFocused && typeof _lastFocused.focus === 'function') _lastFocused.focus();
}

// Close on backdrop click
document.getElementById('achievement-detail-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('achievement-detail-modal')) closeAchievementDetail();
});

// Close on Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAchievementDetail();
});

// Render — achievements always come from the engine (6 definitions, always present).
(async () => {
  const stats = await GamificationEngine.getStats();
  _achievements = stats.achievements;
  document.getElementById('ach-count').textContent = `${stats.earnedCount} / ${stats.totalAchievements}`;
  renderAchievements(_achievements);
})();
</script>
</body>
</html>
