<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ReGrip — 풍선 게임</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<link rel="stylesheet" href="sensor-ui.css"/>
<script src="tailwind-config.js"></script>
<style>
  #game-viewport { background: linear-gradient(180deg, #BAE6FD 0%, #E0F2FE 60%, #FFF1ED 100%); }

  /* Balloon */
  #balloon-wrap { position: absolute; left: 50%; transform: translateX(-50%); transition: bottom 0.08s linear; }

  /* Target zone */
  #target-zone {
    position: absolute; left: 0; right: 0;
    background: rgba(16,185,129,0.15);
    border-top: 3px dashed #10B981;
    border-bottom: 3px dashed #10B981;
  }
  #target-zone.holding { background: rgba(16,185,129,0.35); }

  /* Target-zone entry pulse (hard inset ring, 0 blur — on-brand) */
  @keyframes zonePulse {
    0%,100% { box-shadow: inset 0 0 0 0 rgba(16,185,129,0); }
    50%     { box-shadow: inset 0 0 0 3px rgba(16,185,129,0.9); }
  }
  #target-zone.zone-pulse { animation: zonePulse 0.18s ease-out; }

  /* Pop particles */
  .particle {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: popParticle 0.5s ease-out forwards;
    pointer-events: none;
  }
  @keyframes popParticle {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* Balloon hold vibration (≥2s) */
  @keyframes balloonShake {
    0%,100% { transform: translate(0,0); }
    25%     { transform: translate(-1.5px, 1px); }
    50%     { transform: translate(1.5px, -1px); }
    75%     { transform: translate(-1px, -1.5px); }
  }
  #balloon-svg.balloon-shake { animation: balloonShake 0.12s linear infinite; }

  /* Screen flash on pop */
  #pop-flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 45; }

  /* Floating +1 label */
  .plus-one {
    position: absolute; z-index: 20; pointer-events: none;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px;
    color: #10B981; text-shadow: 2px 2px 0 #0F172A;
    transform: translate(-50%, -50%);
  }

  /* In-zone hold label (near target zone) */
  #target-label.holding { color: #059669; }

  /* Hold arc (SVG timer) */
  #hold-arc { stroke-dasharray: 157; stroke-dashoffset: 157; transition: stroke-dashoffset 0.1s linear; }

  /* Timer last-10s warning */
  @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  #timer-display.timer-warning { color: var(--error) !important; transform-origin: left center; animation: timerPulse 0.6s ease-in-out infinite; }

  /* Result overlay */
  #result-overlay { display: none; }
  #result-overlay.open { display: flex; }
  #result-overlay .result-card {
    transform: translateY(24px); opacity: 0;
    transition: transform 0.4s var(--ease-out), opacity 0.4s var(--ease-out);
  }
  #result-overlay.shown .result-card { transform: translateY(0); opacity: 1; }
  @keyframes starPop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }
  #result-stars .star-pop { display: inline-block; animation: starPop 0.34s var(--ease-out) both; }

  /* Cloud float */
  .cloud { animation: cloudDrift linear infinite; }
  @keyframes cloudDrift {
    0%   { transform: translateX(-120px); }
    100% { transform: translateX(calc(100vw + 120px)); }
  }

  /* Gauge */
  #gauge-fill { transition: height 0.08s linear, background 0.18s ease; }
  .gauge-tick { position: absolute; left: 2px; right: 2px; height: 2px; background: rgba(18,38,58,0.22); z-index: 3; pointer-events: none; }
  #gauge-peak { transition: bottom 0.25s linear; }
</style>
</head>
<body class="bg-ink-black text-on-surface" style="background:#12263A;">

<!-- ══ GAME SCREEN ══════════════════════════════════════════════════════════ -->
<div id="game-screen" class="min-h-screen flex flex-col">

  <!-- Header (minimal) -->
  <header class="flex items-center justify-between px-6 py-3" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid rgba(255,255,255,0.65);">
    <div class="font-display text-xl font-bold text-primary italic">ReGrip</div>
    <div class="flex items-center gap-4">
      <!-- Control hint -->
      <div class="game-hud-hint font-display text-xs font-bold px-3 py-1 rounded-full text-on-surface-variant animate-pulse" style="background:rgba(255,255,255,0.5);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);">
        SPACE / 클릭 홀드
      </div>
      <!-- Sensor status (filled by GameShell) -->
      <div id="sensor-badge" class="font-display text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2" style="background:rgba(255,255,255,0.5);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);"></div>
      <button id="exit-btn" class="font-display font-bold text-sm px-4 py-2 rounded-full" style="background:rgba(255,255,255,0.5);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 4px 16px rgba(42,74,111,0.08);">
        종료
      </button>
    </div>
  </header>

  <!-- Game Layout -->
  <div class="game-layout flex-1 flex gap-0">

    <!-- Left HUD -->
    <aside class="game-hud-left w-56 p-5 flex flex-col gap-4 flex-shrink-0" style="background:rgba(255,255,255,0.4);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-right:1px solid rgba(255,255,255,0.65);">
      <!-- Timer -->
      <div class="rounded-xl p-4" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 8px 32px rgba(42,74,111,0.2);border-top:4px solid var(--primary);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">남은 시간</div>
        <div id="timer-display" class="font-display text-5xl font-bold text-primary tabular">2:00</div>
      </div>
      <!-- Score -->
      <div class="rounded-xl p-4" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 8px 32px rgba(42,74,111,0.2);border-top:4px solid #10B981;">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">터뜨린 풍선</div>
        <div id="score-display" class="font-display text-5xl font-bold tabular" style="color:#10B981;" aria-live="polite">0</div>
      </div>
      <!-- Hold progress -->
      <div class="rounded-xl p-4" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 4px 16px rgba(42,74,111,0.08);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-2">목표 유지</div>
        <div class="flex items-center gap-2">
          <svg width="40" height="40" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" stroke="#D6E6F2" stroke-width="6" fill="none"/>
            <circle id="hold-arc" cx="25" cy="25" r="20" stroke="#10B981" stroke-width="6" fill="none"
                    stroke-linecap="round" transform="rotate(-90 25 25)"/>
          </svg>
          <div>
            <div id="hold-secs" class="font-display text-lg font-bold text-on-surface tabular">0.0s</div>
            <div class="font-display text-xs text-on-surface-variant">/ 3.0s</div>
          </div>
        </div>
      </div>
      <!-- Instructions -->
      <div class="game-hud-verbose mt-auto rounded-lg p-4 text-sm" style="background:rgba(255,255,255,0.4);border:1px dashed rgba(42,74,111,0.35);">
        <strong class="text-primary block mb-1 font-display text-xs">훈련 방법</strong>
        손을 쥐어 풍선을 올리세요. 초록 구간에서 3초간 유지하면 팝!
      </div>
    </aside>

    <!-- Center Viewport -->
    <div id="game-viewport" class="game-stage flex-1 relative overflow-hidden select-none">
      <!-- Clouds (decorative) -->
      <div class="cloud absolute" style="top:8%;animation-duration:18s;animation-delay:0s;">
        <div class="flex items-end gap-0">
          <div class="w-20 h-10 bg-white rounded-full opacity-80"></div>
          <div class="w-12 h-7 bg-white rounded-full opacity-80 -ml-3"></div>
        </div>
      </div>
      <div class="cloud absolute" style="top:20%;animation-duration:24s;animation-delay:-8s;">
        <div class="w-28 h-9 bg-white rounded-full opacity-60"></div>
      </div>

      <!-- Target Zone (positioned by JS) -->
      <div id="target-zone"></div>
      <div id="target-label" class="absolute z-10 font-display text-xs font-bold text-mint-green pointer-events-none"
           style="left:50%;transform:translateX(-50%);">
        ▲ TARGET ZONE ▲
      </div>

      <!-- Balloon -->
      <div id="balloon-wrap" style="bottom:10%;">
        <svg id="balloon-svg" width="90" height="120" viewBox="0 0 90 120" fill="none">
          <ellipse id="balloon-body" cx="45" cy="48" rx="36" ry="44" fill="#F472B6" stroke="#0F172A" stroke-width="3.5"/>
          <ellipse cx="32" cy="30" rx="11" ry="16" fill="rgba(255,255,255,0.35)" transform="rotate(-20 32 30)"/>
          <path d="M38 92 Q45 104 52 92" stroke="#0F172A" stroke-width="2.5" fill="none"/>
          <path id="balloon-string" d="M45 96 Q50 108 45 120" stroke="#251915" stroke-width="2" fill="none"/>
        </svg>
      </div>
    </div>

    <!-- Right Gauge -->
    <aside class="game-hud-right w-28 p-4 flex flex-col items-center flex-shrink-0" style="background:rgba(255,255,255,0.4);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-left:1px solid rgba(255,255,255,0.65);">
      <div class="font-display text-xs font-bold text-on-surface-variant mb-3 text-center">악력</div>

      <div class="game-hud-verbose relative flex items-center justify-center mb-2">
        <div class="font-display text-sm text-on-surface-variant">100%</div>
      </div>
      <div id="gauge-track" role="meter" aria-label="악력 게이지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
           class="flex-1 w-10 relative rounded-full overflow-hidden" style="background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.65);">
        <!-- Target band on gauge (derived from TARGET_HOLD_PCT / TARGET_BAND) -->
        <div id="gauge-target" class="absolute left-0 right-0 pointer-events-none" style="z-index:1;background:rgba(16,185,129,0.18);border-top:2px solid #10B981;border-bottom:2px solid #10B981;"></div>
        <!-- Scale ticks -->
        <div class="gauge-tick" style="bottom:25%;"></div>
        <div class="gauge-tick" style="bottom:50%;"></div>
        <div class="gauge-tick" style="bottom:75%;"></div>
        <!-- Peak hold marker (2px ink line that slowly descends) -->
        <div id="gauge-peak" class="absolute left-0 right-0 pointer-events-none" style="z-index:4;height:2px;background:#12263A;bottom:0;opacity:0;"></div>
        <!-- Fill (color state set by JS) -->
        <div id="gauge-fill" class="absolute bottom-0 left-0 right-0 rounded-full" style="z-index:2;height:0%;background:var(--primary);"></div>
      </div>
      <div class="game-hud-verbose mt-2 mb-1 font-display text-sm text-on-surface-variant">0%</div>
      <div id="force-pct" class="font-display text-2xl font-bold text-primary mt-2 tabular">0%</div>
      <span id="force-live" class="sr-only" aria-live="polite"></span>
    </aside>

  </div>

</div>

<!-- Pop flash layer -->
<div id="pop-flash" aria-hidden="true"></div>


<!-- ══ RESULT OVERLAY ══════════════════════════════════════════════════════ -->
<div id="result-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-6" style="background:rgba(18,38,58,0.55);">
  <div class="result-card w-full max-w-md overflow-hidden" style="background:rgba(255,255,255,0.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,0.65);box-shadow:0 8px 32px rgba(42,74,111,0.2);border-radius:28px;">
    <!-- Banner -->
    <div class="p-8 flex flex-col items-center gap-3 text-center" style="background:#B9D7EA;">
      <div class="w-16 h-16 rounded-full flex items-center justify-center" style="background:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.7);box-shadow:0 4px 16px rgba(42,74,111,0.12);">
        <span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings:'FILL' 1">celebration</span>
      </div>
      <h2 class="font-display text-3xl font-bold tracking-tight text-ink-black">게임 완료</h2>
      <div id="result-stars" class="flex gap-1"></div>
    </div>
    <!-- Stats -->
    <div class="p-6 grid grid-cols-2 gap-3">
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">풍선 팝</div>
        <div id="res-score" class="font-display text-3xl font-bold text-primary tabular">0</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">최대 악력</div>
        <div id="res-max" class="font-display text-3xl font-bold text-primary tabular">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">평균 악력</div>
        <div id="res-avg" class="font-display text-3xl font-bold text-primary tabular">0%</div>
      </div>
      <div class="rounded-xl p-4 text-center" style="background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.65);">
        <div class="font-display text-xs font-bold text-on-surface-variant mb-1">플레이 시간</div>
        <div id="res-time" class="font-display text-3xl font-bold text-primary tabular">2분</div>
      </div>
    </div>
    <!-- Actions (filled by GameShell) -->
    <div id="result-actions" class="px-6 pb-6 flex gap-3"></div>

    <!-- Reward confirmation (GameShell fills xp/levelup/achievements) -->
    <div id="reward-view" class="px-6 pb-6 pt-2 flex-col items-center gap-4 text-center" style="display:none;">
      <div class="font-display text-xs font-bold" style="color:var(--success-text);">서버에 저장 완료</div>
      <div class="flex items-baseline justify-center gap-1">
        <span class="font-display text-4xl font-bold text-primary tabular">+</span>
        <span id="reward-xp" class="font-display text-4xl font-bold text-primary tabular">0</span>
        <span class="font-display text-xl font-bold text-primary">XP</span>
      </div>
      <div id="reward-levelup" class="font-display text-lg font-bold px-4 py-1 rounded-full" style="display:none;background:#FEF9C3;color:#CA8A04;border:1px solid rgba(255,255,255,0.65);">Lv. — 달성!</div>
      <div id="reward-achievements" class="flex flex-wrap gap-2 justify-center"></div>
    </div>
  </div>
</div>


<script src="sensor-service.js"></script>
<script src="sensor-ui.js"></script>
<script src="shared.js"></script>
<script>
// ── Constants (physics/timing — unchanged) ─────────────────────────────────
const GAME_DURATION  = 120;  // seconds
const TARGET_LO      = 0.15; // top 15% of viewport
const TARGET_HI      = 0.30; // top 30%
const TARGET_HOLD    = 3.0;  // seconds in zone to pop
const BALLOON_COLORS = ['#F472B6','#FBBF24','#34D399','#60A5FA','#A78BFA'];
const TARGET_LABEL_DEFAULT = '▲ TARGET ZONE ▲';

// ── State ──────────────────────────────────────────────────────────────────
let balloonPct   = 10;     // 0=bottom, 100=top
let gripForce    = 0;      // 0-100
let pressActive  = false;
let holdTime     = 0;
let score        = 0;
let timeLeft     = GAME_DURATION;
let running      = false;   // loop starts only after countdown (shell onStart)
let colorIndex   = 0;
let forceSamples = [];
let maxForce     = 0;
let peakForce    = 0;      // gauge peak-hold marker
let setDetails   = [];     // per-pop rows for session v2
let wasInZone    = false;
let ariaAccum    = 0;      // 1s throttle accumulator for aria mirror
let gameElapsed  = 0;
let lastTick     = 0;
let rafId        = null;
let finalMetrics = null;   // computed once at end; shared by res-* fill and buildResult

// ── Reduced motion (OS preference — juice gating only; shell handles the setting) ──
let reducedMotion = prefersReducedMotion();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  const upd = () => { reducedMotion = prefersReducedMotion(); };
  if (mq.addEventListener) mq.addEventListener('change', upd);
  else if (mq.addListener) mq.addListener(upd);
}

// ── DOM refs ───────────────────────────────────────────────────────────────
const balloonWrap = document.getElementById('balloon-wrap');
const balloonSvg  = document.getElementById('balloon-svg');
const balloonBody = document.getElementById('balloon-body');
const targetZone  = document.getElementById('target-zone');
const targetLabel = document.getElementById('target-label');
const gaugeFill   = document.getElementById('gauge-fill');
const gaugeTarget = document.getElementById('gauge-target');
const gaugeTrack  = document.getElementById('gauge-track');
const gaugePeak   = document.getElementById('gauge-peak');
const holdArc     = document.getElementById('hold-arc');
const holdSecsEl  = document.getElementById('hold-secs');
const timerEl     = document.getElementById('timer-display');
const scoreEl     = document.getElementById('score-display');
const forcePctEl  = document.getElementById('force-pct');
const forceLive   = document.getElementById('force-live');
const viewport    = document.getElementById('game-viewport');
const flashEl     = document.getElementById('pop-flash');

// ── Shell (bootstrap / ready overlay / pause / result-save-reward) ───────────
const shell = GameShell.create({
  gameId: 'balloon',
  viewportId: 'game-viewport',
  howto: [
    { icon: 'back_hand',    text: '힘을 주어 풍선을 초록 구간까지 올리세요' },
    { icon: 'timer',        text: '악력 게이지의 초록 범위에서 3초 유지하면 풍선이 팝!' },
    { icon: 'keyboard',     text: '스페이스바 또는 화면 터치로도 연습할 수 있어요' },
  ],
  onStart,
  onPauseChange,
  buildResult,
  onCleanup,
  onReset,
});

// ── Personalization (difficulty-parameterized; physics equilibrium unchanged) ──
const TARGET_HOLD_PCT = shell.cfg.targetHoldPct;                 // 60 (평형 유지 악력 %)
const TARGET_BAND     = shell.cfg.targetBand;                    // easy 28 / medium 20 / hard 12
const BAND_LO = TARGET_HOLD_PCT - TARGET_BAND / 2;              // 밴드 하단
const BAND_HI = TARGET_HOLD_PCT + TARGET_BAND / 2;             // 밴드 상단

// ── Input (shell-bound: Space@document + pointer/touch@viewport, playing-gated) ──
shell.bindPress(() => { pressActive = true; }, () => { pressActive = false; });

// ── Sensor integration ─────────────────────────────────────────────────────
const onForce = f => { gripForce = f; };
SensorService.onForceUpdate(onForce);

// ── Target zone + gauge band positioning ─────────────────────────────────────
function layoutTarget() {
  targetZone.style.top    = (TARGET_LO * 100) + '%';
  targetZone.style.height = ((TARGET_HI - TARGET_LO) * 100) + '%';
  targetLabel.style.top   = (TARGET_HI * 100 + 1) + '%';

  // Gauge target band — derived from the SAME constants as the physics equilibrium.
  gaugeTarget.style.bottom = BAND_LO + '%';
  gaugeTarget.style.height = TARGET_BAND + '%';
}
layoutTarget();
window.addEventListener('resize', layoutTarget);

// ── Balloon color ──────────────────────────────────────────────────────────
function nextColor() {
  colorIndex = (colorIndex + 1) % BALLOON_COLORS.length;
  balloonBody.setAttribute('fill', BALLOON_COLORS[colorIndex]);
}
nextColor();   // set initial color

// ── Juice helpers (all no-op under reduced motion) ──────────────────────────
function popFlash() {
  if (reducedMotion || !flashEl.animate) return;
  flashEl.animate([{ opacity: 0 }, { opacity: 0.8 }, { opacity: 0 }], { duration: 80, easing: 'ease-out' });
}
function floatPlusOne(cx, cy) {
  if (reducedMotion) return;
  const el = document.createElement('div');
  el.className = 'plus-one';
  el.textContent = '+1';
  el.style.left = cx + 'px';
  el.style.top  = cy + 'px';
  viewport.appendChild(el);
  if (el.animate) {
    const a = el.animate(
      [{ transform: 'translate(-50%,-50%) translateY(0)', opacity: 1 },
       { transform: 'translate(-50%,-50%) translateY(-46px)', opacity: 0 }],
      { duration: 600, easing: 'cubic-bezier(0.22,1,0.36,1)' });
    a.onfinish = () => el.remove();
  } else { setTimeout(() => el.remove(), 600); }
}

// ── Pop animation ──────────────────────────────────────────────────────────
function popBalloon() {
  score++;
  scoreEl.textContent = score;                    // essential (always)
  setDetails.push({ setNum: score, force: Math.round(gripForce), holdSecs: TARGET_HOLD });

  const rect   = balloonWrap.getBoundingClientRect();
  const vpRect = viewport.getBoundingClientRect();
  const cx = rect.left - vpRect.left + rect.width  / 2;
  const cy = rect.top  - vpRect.top  + rect.height / 2;

  if (!reducedMotion) {
    popFlash();
    // Particles (16-20, random size)
    const colors = ['#F472B6','#FBBF24','#34D399','#60A5FA','#F97316'];
    const n = 16 + Math.floor(Math.random() * 5);
    for (let i = 0; i < n; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 8 + Math.random() * 8;
      p.style.width  = size + 'px';
      p.style.height = size + 'px';
      p.style.left   = cx + 'px';
      p.style.top    = cy + 'px';
      p.style.background = colors[i % colors.length];
      const angle = (i / n) * 2 * Math.PI;
      const dist  = 60 + Math.random() * 70;
      p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      viewport.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
    floatPlusOne(cx, cy);
    // Score number bump (1.4 → 1)
    if (scoreEl.animate) scoreEl.animate(
      [{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }],
      { duration: 320, easing: 'cubic-bezier(0.34,1.56,0.64,1)' });
  }

  // Reset balloon
  nextColor();
  balloonPct = 5;
  holdTime   = 0;
  targetZone.classList.remove('holding');
  targetLabel.classList.remove('holding');
  targetLabel.textContent = TARGET_LABEL_DEFAULT;
  balloonSvg.classList.remove('balloon-shake');
  wasInZone = false;

  // Respawn bounce entrance
  if (!reducedMotion && balloonSvg.animate) balloonSvg.animate(
    [{ transform: 'scale(0.4)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }],
    { duration: 420, easing: 'cubic-bezier(0.34,1.56,0.64,1)' });
}

// ── Game loop (rAF) ────────────────────────────────────────────────────────
function gameTick() {
  if (!running || !shell.playing) { rafId = null; return; }

  const now = performance.now();
  const activeDt = Math.max(0, (now - lastTick) / 1000);
  // A blocked frame is unobserved play, not a jump in simulation or held time.
  if (activeDt > 0.25) { shell.pause('timing'); rafId = null; return; }
  const dt = activeDt;
  lastTick  = now;
  gameElapsed += activeDt;
  timeLeft = Math.max(0, Math.ceil((shell.isPractice() ? 20 : GAME_DURATION) - gameElapsed));
  timerEl.textContent = `${Math.floor(timeLeft / 60)}:${String(timeLeft % 60).padStart(2,'0')}`;
  timerEl.classList.toggle('timer-warning', timeLeft <= 10);

  // Simulated grip via press (ramp reaches TARGET_HOLD_PCT easily)
  if (SensorService.getMode() === 'simulation') {
    gripForce = pressActive ? Math.min(100, gripForce + 55 * dt)
                            : Math.max(0, gripForce - 45 * dt);
    SensorService.setSimulatedForce(gripForce);
  }

  forceSamples.push(gripForce);
  if (gripForce > maxForce) maxForce = gripForce;

  // The displayed force band actually stabilizes the balloon inside the height target.
  const alreadyInZone = balloonPct >= (1 - TARGET_HI) * 100 && balloonPct <= (1 - TARGET_LO) * 100;
  const inForceBand = gripForce >= BAND_LO && gripForce <= BAND_HI;
  const velocity = alreadyInZone && inForceBand ? 0
    : Math.max(-12, Math.min(12, (gripForce - TARGET_HOLD_PCT) * 0.6));
  balloonPct = Math.max(2, Math.min(98, balloonPct + velocity * dt));

  const balloonTopRatio = 1 - (balloonPct / 100);
  const inZone = balloonTopRatio >= TARGET_LO && balloonTopRatio <= TARGET_HI;
  const holding = inZone && inForceBand;

  if (holding) {
    holdTime += dt;
    targetZone.classList.add('holding');
    if (!wasInZone && !reducedMotion) {
      targetZone.classList.add('zone-pulse');
      setTimeout(() => targetZone.classList.remove('zone-pulse'), 200);
    }
  } else {
    holdTime = Math.max(0, holdTime - dt * 0.5);
    targetZone.classList.remove('holding');
  }
  wasInZone = holding;

  // In-zone live label — "유지 중! N초" while in the target band, default otherwise.
  // target-label has no aria-live, so this never double-announces with #force-live.
  if (holding) {
    targetLabel.classList.add('holding');
    targetLabel.textContent = '유지 중! ' + holdTime.toFixed(1) + '초';
  } else if (inZone) {
    targetLabel.classList.remove('holding');
    targetLabel.textContent = '게이지의 초록 범위에 맞춰 주세요';
  } else if (targetLabel.textContent !== TARGET_LABEL_DEFAULT) {
    targetLabel.classList.remove('holding');
    targetLabel.textContent = TARGET_LABEL_DEFAULT;
  }

  // Hold vibration once past 2.0s
  if (holding && holdTime >= 2.0 && !reducedMotion) balloonSvg.classList.add('balloon-shake');
  else balloonSvg.classList.remove('balloon-shake');

  if (holdTime >= TARGET_HOLD) popBalloon();
  if (shell.progress(activeDt, score)) return;
  if (timeLeft <= 0) { endGame(); return; }

  // Position + squash/stretch (scaleY ±6%)
  balloonWrap.style.bottom = balloonPct + '%';
  if (!reducedMotion) {
    const sc = Math.max(-0.06, Math.min(0.06, velocity * 0.02));
    balloonWrap.style.transform = `translateX(-50%) scaleY(${(1 + sc).toFixed(3)}) scaleX(${(1 - sc * 0.6).toFixed(3)})`;
  } else {
    balloonWrap.style.transform = 'translateX(-50%)';
  }

  // Gauge fill + color state (미달 primary / 밴드 mint / 초과 warning — 동일 밴드 상수)
  gaugeFill.style.height = gripForce + '%';
  gaugeFill.style.background = gripForce < BAND_LO ? 'var(--primary)'
                             : gripForce <= BAND_HI ? '#10B981'
                             : 'var(--warning)';
  forcePctEl.textContent = Math.round(gripForce) + '%';

  // Peak hold marker (jumps to peak, then slowly descends)
  if (gripForce >= peakForce) peakForce = gripForce;
  else peakForce = Math.max(gripForce, peakForce - 8 * dt);
  gaugePeak.style.bottom  = peakForce + '%';
  gaugePeak.style.opacity = peakForce > 2 ? '1' : '0';

  // Hold arc
  holdArc.style.strokeDashoffset = 157 * (1 - Math.min(holdTime / TARGET_HOLD, 1));
  holdSecsEl.textContent = holdTime.toFixed(1) + 's';

  // A11y — meter value + throttled (1s) live mirror for the per-frame force number
  ariaAccum += dt;
  if (ariaAccum >= 1) {
    ariaAccum = 0;
    const fv = Math.round(gripForce);
    gaugeTrack.setAttribute('aria-valuenow', fv);
    if (forceLive) forceLive.textContent = '악력 ' + fv + '퍼센트';
  }

  rafId = requestAnimationFrame(gameTick);
}

// ── Final metrics (computed once; shared by res-* fill and buildResult) ───────
function computeMetrics() {
  const avgF = forceSamples.length
    ? Math.round(forceSamples.reduce((a,b) => a+b, 0) / forceSamples.length)
    : 0;
  // 서버 제약: avgForce ≤ maxForce ≤ 100. 반올림/샘플 경로로 avg가 max를 넘지 않도록 클램프.
  const maxF = Math.min(100, Math.max(Math.round(maxForce), avgF));
  const stars = starsForScore('balloon', score);
  const elapsedSec  = Math.round(gameElapsed);
  const durationMin = Math.max(1, Math.round(elapsedSec / 60));
  return { avgF, maxF, stars, elapsedSec, durationMin };
}

// ── End game (natural time-out) — fills #res-* then hands off to shell.end() ──
function endGame() {
  if (!running || shell.state.phase === 'ended') return;
  running = false;
  if (rafId)   { cancelAnimationFrame(rafId); rafId = null; }

  finalMetrics = computeMetrics();

  // Game-owned stats (filled before shell.end(), per shell contract).
  animateCount(document.getElementById('res-score'), score,                     { duration: 700 });
  animateCount(document.getElementById('res-max'),   finalMetrics.maxF,          { suffix: '%', duration: 700 });
  animateCount(document.getElementById('res-avg'),   finalMetrics.avgF,          { suffix: '%', duration: 700 });
  animateCount(document.getElementById('res-time'),  finalMetrics.durationMin,   { suffix: '분', duration: 700 });

  // Shell owns: stars render, overlay open, auto-save, reward view.
  shell.end();
}

// ── Session v2 (schema 2) — shell merges difficulty/handUsed/schema ──────────
function buildResult() {
  const m = finalMetrics || computeMetrics();
  return {
    date:        new Date().toISOString(),
    gameId:      'balloon',
    label:       GAME_DEFS.balloon.label,
    durationMin: m.durationMin,
    durationSec: m.elapsedSec,
    sets:        score,              // 풍선 = 팝 수
    attempts:    score,              // 풍선: attempts === score
    avgForce:    m.avgF,
    maxForce:    m.maxF,
    stars:       m.stars,
    setDetails,
    schema:      2,
  };
}

// ── Shell lifecycle callbacks ────────────────────────────────────────────────
function onStart() {
  running      = true;
  gripForce    = SensorService.getForce();
  lastTick     = performance.now();
  rafId = requestAnimationFrame(gameTick);
}

function onPauseChange(paused) {
  pressActive = false;
  if (paused) {
    running = false;                                     // gates timer + gameTick
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  } else {
    running  = true;
    gripForce = SensorService.getForce();
    lastTick = performance.now();
    if (rafId === null) rafId = requestAnimationFrame(gameTick);
  }
}

function onReset() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  balloonPct = 10; gripForce = SensorService.getForce(); pressActive = false;
  holdTime = score = gameElapsed = maxForce = peakForce = ariaAccum = 0;
  timeLeft = GAME_DURATION; running = wasInZone = false;
  forceSamples = []; setDetails = []; finalMetrics = null;
  scoreEl.textContent = '0'; holdSecsEl.textContent = '0.0s'; timerEl.textContent = '2:00';
  timerEl.classList.remove('timer-warning'); balloonSvg.classList.remove('balloon-shake');
  targetZone.classList.remove('holding'); targetLabel.classList.remove('holding');
  targetLabel.textContent = TARGET_LABEL_DEFAULT; holdArc.style.strokeDashoffset = 157;
  balloonWrap.style.bottom = '10%';
  if (SensorService.getMode() === 'simulation') SensorService.setSimulatedForce(0);
}

function onCleanup() {
  running = false;
  if (rafId)   { cancelAnimationFrame(rafId); rafId = null; }
  SensorService.offForceUpdate(onForce);
}

// ── Visibility gating (rAF only; respect shell pause state) ──────────────────
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  } else if (shell.playing && running && rafId === null) {
    lastTick = performance.now();
    rafId = requestAnimationFrame(gameTick);
  }
});

// ── Header exit → shell-owned confirm flow ───────────────────────────────────
const exitBtn = document.getElementById('exit-btn');
if (exitBtn) exitBtn.addEventListener('click', () => shell.confirmExit());
</script>
</body>
